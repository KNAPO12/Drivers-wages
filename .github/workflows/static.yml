      <div class="panel">
        <h3>Список сотрудников</h3>
        <div class="table-wrap">
          <table class="settings-table">
            <thead>
              <tr><th>ФИО</th><th>Должность</th><th>Подразделение</th><th style="text-align:center">Работает</th><th></th></tr>
            </thead>
            <tbody id="staffBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- ====================================================================
         ВКЛАДКА 5: НАСТРОЙКИ SUPABASE И ТАРИФОВ
         ==================================================================== -->
    <div id="tab-settings" class="hidden">
      <div class="panel">
        <h3>Подключение к базе данных Supabase</h3>
        <div class="sub-hint" style="margin-bottom:12px">
          Укажите <b>Project URL</b> и <b>anon public key</b> из настроек проекта Supabase (Project Settings → API). Ключи сохраняются локально в вашем браузере.
        </div>
        <div class="field-grid" style="grid-template-columns: 1fr 1fr auto; align-items: end;">
          <div class="field">
            <label>Supabase Project URL</label>
            <input type="text" id="sbUrlInput" placeholder="https://xxxxxxxxxxxx.supabase.co">
          </div>
          <div class="field">
            <label>Supabase Anon Key</label>
            <input type="password" id="sbKeyInput" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...">
          </div>
          <button class="btn" onclick="saveSupabaseConnection()">Подключить и сохранить</button>
        </div>
        <div id="sbConnStatus" class="status-msg" style="margin-top:8px"></div>
      </div>

      <div class="panel">
        <h3>Тарифы оплаты и штрафы за смену</h3>
        <div class="field-grid">
          <div class="field"><label>Водитель: 1 зона, ₽</label><input type="number" id="tDrvZ1"></div>
          <div class="field"><label>Водитель: 2 зона, ₽</label><input type="number" id="tDrvZ2"></div>
          <div class="field"><label>Водитель: 3 зона, ₽</label><input type="number" id="tDrvZ3"></div>
          <div class="field"><label>Экспедитор: 1 зона, ₽</label><input type="number" id="tExpZ1"></div>
          <div class="field"><label>Экспедитор: 2 зона, ₽</label><input type="number" id="tExpZ2"></div>
          <div class="field"><label>Экспедитор: 3 зона, ₽</label><input type="number" id="tExpZ3"></div>
          <div class="field"><label>Доп. за работу без эксп., ₽</label><input type="number" id="tBezExp"></div>
          <div class="field"><label>Оклад / Командировка, ₽</label><input type="number" id="tBase"></div>
          <div class="field"><label>Штраф опоздание 8:05, ₽</label><input type="number" id="tFine805"></div>
          <div class="field"><label>Штраф опоздание 8:30, ₽</label><input type="number" id="tFine830"></div>
          <div class="field"><label>Штраф за ошибку реестра, ₽</label><input type="number" id="tFineReg"></div>
          <div class="field"><label>Штраф чистота / не увед., ₽</label><input type="number" id="tFineClean"></div>
        </div>
        <button class="btn" onclick="saveTariffs()">Сохранить тарифы</button>
        <span id="tariffSaveMsg" class="status-msg" style="margin-left:10px"></span>
      </div>
    </div>
  </div>

  <script>
    // ========================================================================
    // КОНФИГУРАЦИЯ SUPABASE И СОСТОЯНИЯ ПРИЛОЖЕНИЯ
    // ========================================================================
    const DEFAULT_SUPABASE_CONFIG = {
      url: localStorage.getItem('KNAPO_SB_URL') || '',
      anonKey: localStorage.getItem('KNAPO_SB_KEY') || ''
    };

    const DEFAULT_TARIFFS = JSON.parse(localStorage.getItem('KNAPO_TARIFFS') || 'null') || {
      drvZ1: 1700, drvZ2: 2000, drvZ3: 3400,
      expZ1: 1400, expZ2: 1600, expZ3: 2500,
      bezExp: 700, base: 1700,
      fine805: 300, fine830: 500, fineReg: 200, fineClean: 500
    };

    const STATUS_LIST = ['Я', 'К', 'ОТ', 'Б', 'У', 'В', 'ОП', 'НН'];

    let sbClient = null;
    let activeTab = 'sobranie';
    let repMode = 'day';
    let costViewMode = 'all';
    let empShareMode = 'fot';
    let lastReportData = null;

    let anState = {
      dept: 'ВСЕ',
      granularity: 'day',
      deptDonutMetric: 'routesPct',
      deptDonutTitle: 'Доля по маршрутам',
      roleTab: 'driver',
      bundle: null
    };

    const $ = (id) => document.getElementById(id);
    const pad2 = (n) => (n < 10 ? '0' : '') + n;
    const num = (v) => {
      const n = Number(String(v === null || v === undefined ? '' : v).replace(/\s+/g, '').replace(/,/g, '.'));
      return Number.isFinite(n) ? n : 0;
    };
    const fInt = (n) => (n === null || n === undefined || Number.isNaN(Number(n))) ? 'Недостаточно данных' : Math.round(Number(n)).toLocaleString('ru-RU');
    const fRub = (n) => (n === null || n === undefined || Number.isNaN(Number(n))) ? 'Недостаточно данных' : Math.round(Number(n)).toLocaleString('ru-RU') + ' ₽';
    const fPct = (n, d = 1) => (n === null || n === undefined || Number.isNaN(Number(n))) ? 'Недостаточно данных' : Number(n).toFixed(d).replace('.', ',') + '%';
    const esc = (s) => String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

    function todayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    }
    function currentPeriod() {
      const d = new Date();
      return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
    }
    function formatRuDate(iso) {
      return iso && iso.length >= 10 ? `${iso.slice(8, 10)}.${iso.slice(5, 7)}.${iso.slice(0, 4)}` : iso;
    }

    function initSupabaseClient() {
      const url = ($('sbUrlInput')?.value || DEFAULT_SUPABASE_CONFIG.url || '').trim();
      const key = ($('sbKeyInput')?.value || DEFAULT_SUPABASE_CONFIG.anonKey || '').trim();
      if (!url || !key || !window.supabase) {
        sbClient = null;
        $('sbConnectionBadge').textContent = 'Supabase не подключён · Откройте «⚙️ Настройки Supabase»';
        return false;
      }
      sbClient = window.supabase.createClient(url, key);
      $('sbConnectionBadge').textContent = `Supabase подключён (${url.replace(/^https?:\/\//, '')})`;
      return true;
    }

    function saveSupabaseConnection() {
      const url = $('sbUrlInput').value.trim();
      const key = $('sbKeyInput').value.trim();
      localStorage.setItem('KNAPO_SB_URL', url);
      localStorage.setItem('KNAPO_SB_KEY', key);
      DEFAULT_SUPABASE_CONFIG.url = url;
      DEFAULT_SUPABASE_CONFIG.anonKey = key;
      const ok = initSupabaseClient();
      $('sbConnStatus').textContent = ok ? 'Подключение к Supabase сохранено ✓' : 'Укажите корректный URL и Anon Key';
      if (ok) refreshActiveTab(true);
    }

    function loadTariffsToForm() {
      $('tDrvZ1').value = DEFAULT_TARIFFS.drvZ1;
      $('tDrvZ2').value = DEFAULT_TARIFFS.drvZ2;
      $('tDrvZ3').value = DEFAULT_TARIFFS.drvZ3;
      $('tExpZ1').value = DEFAULT_TARIFFS.expZ1;
      $('tExpZ2').value = DEFAULT_TARIFFS.expZ2;
      $('tExpZ3').value = DEFAULT_TARIFFS.expZ3;
      $('tBezExp').value = DEFAULT_TARIFFS.bezExp;
      $('tBase').value = DEFAULT_TARIFFS.base;
      $('tFine805').value = DEFAULT_TARIFFS.fine805;
      $('tFine830').value = DEFAULT_TARIFFS.fine830;
      $('tFineReg').value = DEFAULT_TARIFFS.fineReg;
      $('tFineClean').value = DEFAULT_TARIFFS.fineClean;
    }

    function saveTariffs() {
      DEFAULT_TARIFFS.drvZ1 = num($('tDrvZ1').value);
      DEFAULT_TARIFFS.drvZ2 = num($('tDrvZ2').value);
      DEFAULT_TARIFFS.drvZ3 = num($('tDrvZ3').value);
      DEFAULT_TARIFFS.expZ1 = num($('tExpZ1').value);
      DEFAULT_TARIFFS.expZ2 = num($('tExpZ2').value);
      DEFAULT_TARIFFS.expZ3 = num($('tExpZ3').value);
      DEFAULT_TARIFFS.bezExp = num($('tBezExp').value);
      DEFAULT_TARIFFS.base = num($('tBase').value);
      DEFAULT_TARIFFS.fine805 = num($('tFine805').value);
      DEFAULT_TARIFFS.fine830 = num($('tFine830').value);
      DEFAULT_TARIFFS.fineReg = num($('tFineReg').value);
      DEFAULT_TARIFFS.fineClean = num($('tFineClean').value);
      localStorage.setItem('KNAPO_TARIFFS', JSON.stringify(DEFAULT_TARIFFS));
      $('tariffSaveMsg').textContent = 'Тарифы сохранены ✓';
      setTimeout(() => { $('tariffSaveMsg').textContent = ''; }, 2500);
    }

    // ========================================================================
    // НАВИГАЦИЯ ПО ВКЛАДКАМ
    // ========================================================================
    const ALL_TABS = ['sobranie', 'analytics', 'vvod', 'staff', 'settings'];

    function switchTab(tab) {
      activeTab = tab;
      ALL_TABS.forEach((t) => {
        $(`tab-${t}`).classList.toggle('hidden', t !== tab);
        $(`tab-btn-${t}`).classList.toggle('active', t === tab);
      });
      refreshActiveTab(false);
    }

    function refreshActiveTab(force) {
      if (!sbClient && !initSupabaseClient()) {
        if (activeTab !== 'settings') {
          $('repStatus').textContent = 'Укажите URL и Anon Key Supabase во вкладке «⚙️ Настройки Supabase»';
        }
        return;
      }
      if (activeTab === 'sobranie') loadSobranie(force);
      if (activeTab === 'analytics') initAnalytics();
      if (activeTab === 'vvod') initVvod();
      if (activeTab === 'staff') loadStaff();
      if (activeTab === 'settings') {
        $('sbUrlInput').value = DEFAULT_SUPABASE_CONFIG.url;
        $('sbKeyInput').value = DEFAULT_SUPABASE_CONFIG.anonKey;
        loadTariffsToForm();
      }
    }

    // ========================================================================
    // ЗАПРОСЫ К БАЗЕ SUPABASE
    // ========================================================================
    async function fetchAllSourceData() {
      if (!sbClient && !initSupabaseClient()) {
        throw new Error('Не заданы настройки подключения Supabase');
      }
      const [staffRes, dailyRes, costsRes, monthlyRes, normsRes] = await Promise.all([
        sbClient.from('staff').select('*').order('name', { ascending: true }),
        sbClient.from('daily_entries').select('*').order('entry_date', { ascending: true }),
        sbClient.from('daily_costs').select('*').order('cost_date', { ascending: true }),
        sbClient.from('monthly_1c').select('*'),
        sbClient.from('kpi_norms').select('*').order('effective_from', { ascending: false })
      ]);

      if (staffRes.error) throw new Error('staff: ' + staffRes.error.message);
      if (dailyRes.error) throw new Error('daily_entries: ' + dailyRes.error.message);
      if (costsRes.error) throw new Error('daily_costs: ' + costsRes.error.message);
      if (monthlyRes.error) throw new Error('monthly_1c: ' + monthlyRes.error.message);
      if (normsRes.error) throw new Error('kpi_norms: ' + normsRes.error.message);

      return {
        staff: staffRes.data || [],
        daily: dailyRes.data || [],
        costs: costsRes.data || [],
        monthly: monthlyRes.data || [],
        norms: normsRes.data || []
      };
    }

    // ========================================================================
    // ВКЛАДКА «СОБРАНИЕ»: РАСЧЁТ И ОТРИСОВКА
    // ========================================================================
    let repReady = false;
    function setRepMode(m) {
      repMode = m;
      ['day', 'week', 'month'].forEach((k) => $(`seg-${k}`).classList.toggle('on', k === m));
      $('repDate').classList.toggle('hidden', m === 'month');
      $('repMonth').classList.toggle('hidden', m !== 'month');
      loadSobranie(true);
    }
    function setCostViewMode(m) {
      costViewMode = m;
      const btns = $('costModePills').querySelectorAll('.pill-btn');
      btns[0].classList.toggle('on', m === 'all');
      btns[1].classList.toggle('on', m === 'noRent');
      if (lastReportData) renderSobranieCostsAndCharts(lastReportData);
    }
    function setEmpShareMode(m) {
      empShareMode = m;
      const arr = ['fot', 'trips', 'discipline', '1c'];
      $('empMetricPills').querySelectorAll('.pill-btn').forEach((b, i) => b.classList.toggle('on', arr[i] === m));
      if (lastReportData) renderSobranieEmpShares(lastReportData);
    }

    function buildRangeBuckets(mode, anchor) {
      let from, to, prevFrom, prevTo;
      const buckets = [];
      if (mode === 'month') {
        const [y, m] = anchor.split('-').map(Number);
        from = `${anchor}-01`;
        const lastD = new Date(Date.UTC(y, m, 0));
        to = lastD.toISOString().slice(0, 10);
        const py = m === 1 ? y - 1 : y;
        const pm = m === 1 ? 12 : m - 1;
        prevFrom = `${py}-${pad2(pm)}-01`;
        prevTo = new Date(Date.UTC(py, pm, 0)).toISOString().slice(0, 10);

        let cur = new Date(Date.UTC(y, m - 1, 1));
        while (cur <= lastD) {
          const shift = (cur.getUTCDay() + 6) % 7;
          let wEnd = new Date(cur.getTime() + (6 - shift) * 86400000);
          if (wEnd > lastD) wEnd = lastD;
          const bf = cur.toISOString().slice(0, 10);
          const bt = wEnd.toISOString().slice(0, 10);
          buckets.push({ from: bf, to: bt, label: `${bf.slice(8,10)}.${bf.slice(5,7)}–${bt.slice(8,10)}.${bt.slice(5,7)}`, shortLabel: `${bf.slice(8,10)}.${bf.slice(5,7)}` });
          cur = new Date(wEnd.getTime() + 86400000);
        }
        return { from, to, prevFrom, prevTo, buckets, monthKey: anchor };
      }

      const d = new Date(`${anchor}T00:00:00Z`);
      if (mode === 'week') {
        const shift = (d.getUTCDay() + 6) % 7;
        const start = new Date(d.getTime() - shift * 86400000);
        const end = new Date(start.getTime() + 6 * 86400000);
        from = start.toISOString().slice(0, 10);
        to = end.toISOString().slice(0, 10);
        prevFrom = new Date(start.getTime() - 7 * 86400000).toISOString().slice(0, 10);
        prevTo = new Date(start.getTime() - 86400000).toISOString().slice(0, 10);
        for (let i = 4; i >= 0; i--) {
          const bs = new Date(start.getTime() - i * 7 * 86400000);
          const be = new Date(bs.getTime() + 6 * 86400000);
          const bf = bs.toISOString().slice(0, 10), bt = be.toISOString().slice(0, 10);
          buckets.push({ from: bf, to: bt, label: `${bf.slice(8,10)}.${bf.slice(5,7)}–${bt.slice(8,10)}.${bt.slice(5,7)}`, shortLabel: `${bf.slice(8,10)}.${bf.slice(5,7)}` });
        }
        return { from, to, prevFrom, prevTo, buckets, monthKey: anchor.slice(0, 7) };
      }

      from = anchor;
      to = anchor;
      prevFrom = new Date(d.getTime() - 86400000).toISOString().slice(0, 10);
      prevTo = prevFrom;
      for (let i = 6; i >= 0; i--) {
        const bs = new Date(d.getTime() - i * 86400000);
        const df = bs.toISOString().slice(0, 10);
        buckets.push({ from: df, to: df, label: `${df.slice(8,10)}.${df.slice(5,7)}`, shortLabel: `${df.slice(8,10)}.${df.slice(5,7)}` });
      }
      return { from, to, prevFrom, prevTo, buckets, monthKey: anchor.slice(0, 7) };
    }

    async function loadSobranie() {
      if (!repReady) {
        repReady = true;
        $('repDate').value = todayStr();
        $('repMonth').value = $('periodInput').value || currentPeriod();
      }
      const anchor = repMode === 'month' ? $('repMonth').value : $('repDate').value;
      $('repStatus').textContent = 'Загрузка из Supabase...';

      try {
        const src = await fetchAllSourceData();
        const rng = buildRangeBuckets(repMode, anchor);
        const acc = {}, prevAcc = {};
        let totalPay = 0, totalBasePay = 0, totalFine = 0, prevTotalPay = 0, prevTotalFine = 0;
        let totalZoneTrips = 0, prevTotalZoneTrips = 0, totalIssues = 0;

        const bucketData = rng.buckets.map((b) => ({
          ...b, pay: 0, fine: 0, fuel: 0, repair: 0, rental: 0, payrollExtra: 0, orders: 0, trips: 0
        }));

        for (const r of src.daily) {
          const ds = String(r.entry_date || '').slice(0, 10);
          const name = r.staff_name;
          const z1 = num(r.z1), z2 = num(r.z2), z3 = num(r.z3);
          const r2z1 = num(r.r2z1), r2z2 = num(r.r2z2), r2z3 = num(r.r2z3);
          const bezExp = num(r.bez_exp), otLog = num(r.ot_logista);
          const l805 = r.late_805 ? 1 : 0, l830 = r.late_830 ? 1 : 0;
          const regErr = num(r.registry_errors), cln = r.clean ? 1 : 0, notNotif = r.not_notified ? 1 : 0;
          const pay = num(r.pay), fine = num(r.fine), tot = num(r.total);
          const stc = r.status || 'Я';
          const rowTrips = z1 + z2 + z3 + r2z1 + r2z2 + r2z3;
          const rowIss = l805 + l830 + regErr + notNotif;

          if (ds >= rng.from && ds <= rng.to) {
            const a = acc[name] || (acc[name] = {
              z1: 0, z2: 0, z3: 0, r2z1: 0, r2z2: 0, r2z3: 0, bezExp: 0, otLogista: 0,
              late805: 0, late830: 0, registryErrors: 0, clean: 0, notNotified: 0,
              pay: 0, fine: 0, total: 0, st: {}, comment: ''
            });
            a.z1 += z1; a.z2 += z2; a.z3 += z3;
            a.r2z1 += r2z1; a.r2z2 += r2z2; a.r2z3 += r2z3;
            a.bezExp += bezExp; a.otLogista += otLog;
            a.late805 += l805; a.late830 += l830;
            a.registryErrors += regErr; a.clean += cln; a.notNotified += notNotif;
            a.pay += pay; a.fine += fine; a.total += tot;
            a.st[stc] = (a.st[stc] || 0) + 1;
            a.comment = r.comment || a.comment;

            totalBasePay += pay; totalFine += fine; totalPay += tot;
            totalZoneTrips += rowTrips; totalIssues += rowIss;
          }

          if (ds >= rng.prevFrom && ds <= rng.prevTo) {
            const pa = prevAcc[name] || (prevAcc[name] = { total: 0, trips: 0 });
            pa.total += tot; pa.trips += rowTrips;
            prevTotalPay += tot; prevTotalFine += fine; prevTotalZoneTrips += rowTrips;
          }

          for (const b of bucketData) {
            if (ds >= b.from && ds <= b.to) { b.pay += tot; b.fine += fine; }
          }
        }

        const c = { fuel: 0, repair: 0, rental: 0, payrollExtra: 0, orders: 0, trips: 0, deliveryDiscrepancies: 0, assemblyErrors: 0 };
        for (const cr of src.costs) {
          const cs = String(cr.cost_date || '').slice(0, 10);
          if (cs >= rng.from && cs <= rng.to) {
            c.fuel += num(cr.fuel); c.repair += num(cr.repair); c.rental += num(cr.rental); c.payrollExtra += num(cr.payroll_extra);
            c.orders += num(cr.orders); c.trips += num(cr.trips); c.deliveryDiscrepancies += num(cr.delivery_discrepancies); c.assemblyErrors += num(cr.assembly_errors);
          }
          for (const b of bucketData) {
            if (cs >= b.from && cs <= b.to) {
              b.fuel += num(cr.fuel); b.repair += num(cr.repair); b.rental += num(cr.rental); b.payrollExtra += num(cr.payroll_extra);
              b.orders += num(cr.orders); b.trips += num(cr.trips);
            }
          }
        }

        const mRowsSrc = src.monthly.filter((m) => String(m.period_ym || '').slice(0, 7) === rng.monthKey);
        const mMap = {};
        let totPts = 0, totTon = 0, totReg = 0;
        for (const mr of mRowsSrc) {
          const pts = num(mr.points), ton = num(mr.tonnage_kg), reg = num(mr.registry_sum);
          mMap[mr.staff_name] = { points: pts, tonnageKg: ton, registrySum: reg };
          totPts += pts; totTon += ton; totReg += reg;
        }

        const rows = [];
        for (const s of src.staff) {
          const a = acc[s.name];
          const pa = prevAcc[s.name] || { total: 0, trips: 0 };
          if (!s.active && !a) continue;
          const dAcc = a || {
            z1: 0, z2: 0, z3: 0, r2z1: 0, r2z2: 0, r2z3: 0, bezExp: 0, otLogista: 0,
            late805: 0, late830: 0, registryErrors: 0, clean: 0, notNotified: 0,
            pay: 0, fine: 0, total: 0, st: {}, comment: ''
          };
          const status = repMode === 'day'
            ? (Object.keys(dAcc.st)[0] || '')
            : STATUS_LIST.filter((code) => dAcc.st[code]).map((code) => `${code} ${dAcc.st[code]}`).join(' · ');
          const cls = repMode === 'day' && status ? `status-${status}` : '';
          const empTrips = dAcc.z1 + dAcc.z2 + dAcc.z3 + dAcc.r2z1 + dAcc.r2z2 + dAcc.r2z3;
          const payShare = totalPay > 0 ? (dAcc.total / totalPay) * 100 : 0;
          const prevPayShare = prevTotalPay > 0 ? (pa.total / prevTotalPay) * 100 : null;
          const tripsShare = totalZoneTrips > 0 ? (empTrips / totalZoneTrips) * 100 : 0;
          const prevTripsShare = prevTotalZoneTrips > 0 ? (pa.trips / prevTotalZoneTrips) * 100 : null;
          const mInfo = mMap[s.name] || { points: 0, tonnageKg: 0, registrySum: 0 };

          rows.push({
            name: s.name, role: s.role, status, cls, comment: repMode === 'day' ? dAcc.comment : '',
            ...dAcc, empTrips,
            payShare, payShareDeltaPp: prevPayShare !== null ? payShare - prevPayShare : null,
            tripsShare, tripsShareDeltaPp: prevTripsShare !== null ? tripsShare - prevTripsShare : null,
            fineShare: totalFine > 0 ? (dAcc.fine / totalFine) * 100 : 0,
            points: mInfo.points, tonnageKg: mInfo.tonnageKg, registrySum: mInfo.registrySum,
            pointsShare: totPts > 0 ? (mInfo.points / totPts) * 100 : 0,
            tonnageShare: totTon > 0 ? (mInfo.tonnageKg / totTon) * 100 : 0,
            registryShare: totReg > 0 ? (mInfo.registrySum / totReg) * 100 : 0
          });
        }

        const fot = totalPay + c.payrollExtra;
        const costWithoutRental = c.fuel + c.repair + fot;
        const totalCost = costWithoutRental + c.rental;
        const effTrips = c.trips > 0 ? c.trips : totalZoneTrips;
        const pricePerOrder = c.orders > 0 ? totalCost / c.orders : 0;
        const pricePerTrip = effTrips > 0 ? totalCost / effTrips : 0;
        const ordersPerTrip = effTrips > 0 ? c.orders / effTrips : 0;
        const deliveryOk = c.orders > 0 ? Math.max(0, (1 - c.deliveryDiscrepancies / c.orders) * 100) : null;
        const assemblyOk = c.orders > 0 ? Math.max(0, (1 - c.assemblyErrors / c.orders) * 100) : null;

        const history = bucketData.map((b) => {
          const bFot = b.pay + b.payrollExtra;
          const bNoRent = b.fuel + b.repair + bFot;
          const bTot = bNoRent + b.rental;
          return {
            label: b.label, shortLabel: b.shortLabel,
            fuel: b.fuel, repair: b.repair, rental: b.rental, fot: bFot,
            costNoRental: bNoRent, totalCost: bTot,
            pricePerOrder: b.orders > 0 ? bTot / b.orders : 0,
            deliveryOk: b.orders > 0 ? Math.max(0, (1 - b.deliveryDiscrepancies / b.orders) * 100) : 100,
            assemblyOk: b.orders > 0 ? Math.max(0, (1 - b.assemblyErrors / b.orders) * 100) : 100,
            fotShare: bTot > 0 ? (bFot / bTot) * 100 : 0,
            pctMetric: totReg > 0 ? (bTot / (totReg / Math.max(1, bucketData.length))) * 100 : (bTot > 0 ? (bFot / bTot) * 100 : 0),
            fine: b.fine
          };
        });

        lastReportData = {
          mode: repMode, from: rng.from, to: rng.to, rows, costs: c, history,
          monthly: rows.map((r) => ({
            name: r.name, role: r.role, points: r.points, tonnageKg: r.tonnageKg, registrySum: r.registrySum,
            pointsShare: r.pointsShare, tonnageShare: r.tonnageShare, registryShare: r.registryShare
          })),
          kpi: {
            fot, basePay: totalBasePay, totalFine, totalIssues,
            costWithoutRental, totalCost,
            fotSharePct: totalCost > 0 ? (fot / totalCost) * 100 : null,
            pctSalesNoRental: totReg > 0 ? (costWithoutRental / totReg) * 100 : null,
            pctSalesWithRental: totReg > 0 ? (totalCost / totReg) * 100 : null,
            pricePerOrder, pricePerTrip, ordersPerTrip, effectiveTrips: effTrips,
            deliveryOk, assemblyOk,
            totalRegistrySum: totReg, totalTonnageKg: totTon, totalPoints: totPts,
            shares: {
              fuelPct: totalCost > 0 ? (c.fuel / totalCost) * 100 : 0,
              repairPct: totalCost > 0 ? (c.repair / totalCost) * 100 : 0,
              rentalPct: totalCost > 0 ? (c.rental / totalCost) * 100 : 0,
              fotPct: totalCost > 0 ? (fot / totalCost) * 100 : 0
            }
          }
        };

        renderSobranie(lastReportData);
        const modeNames = { day: 'День', week: 'Неделя', month: 'Месяц' };
        $('repStatus').textContent = `${modeNames[repMode]}: ${rng.from === rng.to ? formatRuDate(rng.from) : formatRuDate(rng.from) + ' — ' + formatRuDate(rng.to)}`;
      } catch (err) {
        $('repStatus').textContent = 'Ошибка: ' + err.message;
      }
    }

    function sparkSvg(vals, normVal, lowerBetter) {
      const pts = (vals || []).map((v) => Number(v) || 0);
      if (!pts.length) return '';
      const w = 260, h = 34, px = 8, py = 6;
      let minV = Math.min(...pts), maxV = Math.max(...pts);
      if (normVal !== null && normVal !== undefined) { minV = Math.min(minV, normVal); maxV = Math.max(maxV, normVal); }
      const span = (maxV - minV) || 1;
      const yOf = (v) => h - py - ((v - minV) / span) * (h - py * 2);
      const xOf = (i) => pts.length === 1 ? w / 2 : px + (i / (pts.length - 1)) * (w - px * 2);
      const ny = (normVal !== null && normVal !== undefined) ? yOf(normVal) : h / 2;
      const poly = pts.map((v, i) => `${xOf(i).toFixed(1)},${yOf(v).toFixed(1)}`).join(' ');
      const circles = pts.map((v, i) => {
        const ok = (normVal === null || normVal === undefined) ? true : (lowerBetter ? v <= normVal : v >= normVal);
        const col = v === 0 ? '#94a3b8' : (ok ? '#169c65' : '#d94848');
        return `<circle cx="${xOf(i).toFixed(1)}" cy="${yOf(v).toFixed(1)}" r="${i === pts.length - 1 ? 3.8 : 2.8}" fill="${col}"/>`;
      }).join('');
      return `<svg class="spark-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><line x1="${px}" y1="${ny.toFixed(1)}" x2="${w - px}" y2="${ny.toFixed(1)}" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3,3"/>${pts.length > 1 ? `<polyline fill="none" stroke="#94a3b8" stroke-width="1.5" points="${poly}"/>` : ''}${circles}</svg>`;
    }

    function renderSobranie(d) {
      const k = d.kpi, hist = d.history || [], hasSales = k.totalRegistrySum > 0;
      const topCards = [
        {
          title: hasSales ? 'Логистика / продажи (1С)' : 'Доля ФОТ в расходах',
          val: hasSales ? fPct(k.pctSalesWithRental, 2) : fPct(k.fotSharePct, 1),
          sub: hasSales ? `норма ≤ 3% · без найма ${fPct(k.pctSalesNoRental, 2)}` : `ФОТ ${fRub(k.fot)}`,
          spark: sparkSvg(hist.map((h) => hasSales ? h.pctMetric : h.fotShare), hasSales ? 3 : 65, true),
          alert: hasSales && k.pctSalesWithRental > 3
        },
        {
          title: 'Цена одного заказа',
          val: k.pricePerOrder ? fRub(k.pricePerOrder) : '—',
          sub: `${fInt(d.costs.orders)} заказов · рейсов: ${fInt(k.effectiveTrips)}`,
          spark: sparkSvg(hist.map((h) => h.pricePerOrder), 350, true),
          alert: k.pricePerOrder > 350
        },
        {
          title: 'Доставка без расхождений',
          val: fPct(k.deliveryOk, 1),
          sub: `цель ≥ 99% · расх. ${fInt(d.costs.deliveryDiscrepancies)} шт`,
          spark: sparkSvg(hist.map((h) => h.deliveryOk), 99, false),
          alert: k.deliveryOk !== null && k.deliveryOk < 99
        },
        {
          title: 'Сборка без ошибок',
          val: fPct(k.assemblyOk, 1),
          sub: `цель ≥ 99% · ошиб. ${fInt(d.costs.assemblyErrors)} шт`,
          spark: sparkSvg(hist.map((h) => h.assemblyOk), 99, false),
          alert: k.assemblyOk !== null && k.assemblyOk < 99
        },
        {
          title: 'ФОТ за период',
          val: fRub(k.fot),
          sub: `начисл. ${fRub(k.basePay)} · доп. ${fRub(d.costs.payrollExtra)}`,
          spark: sparkSvg(hist.map((h) => h.fot), null, true),
          alert: false
        },
        {
          title: 'Штрафы и нарушения',
          val: fRub(k.totalFine),
          sub: `случаев нарушений: ${fInt(k.totalIssues)}`,
          spark: sparkSvg(hist.map((h) => h.fine), 0, true),
          alert: k.totalFine > 0 || k.totalIssues > 0
        }
      ];

      $('kpiTopGrid').innerHTML = topCards.map((c) => `
        <div class="kpi-box ${c.alert ? 'alert' : ''}">
          <div class="kpi-box-top"><span class="kpi-box-label">${esc(c.title)}</span><span class="status-dot ${c.alert ? 'red' : 'green'}"></span></div>
          <div class="kpi-box-val">${esc(c.val)}</div>
          <div class="kpi-box-sub">${esc(c.sub)}</div>
          <div class="kpi-box-spark">${c.spark}</div>
        </div>
      `).join('');

      renderSobranieCostsAndCharts(d);
      renderSobranieEmpShares(d);

      const isDay = d.mode === 'day';
      const nCell = (v) => `<td>${v ? fInt(v) : ''}</td>`;
      const kCell = (v) => `<td>${v ? (isDay ? '✓' : v) : ''}</td>`;
      let sp = 0, sf = 0, st = 0;

      $('repBody').innerHTML = d.rows.map((r) => {
        sp += r.pay; sf += r.fine; st += r.total;
        return `<tr class="${r.cls}">
          <td class="name-cell">${esc(r.name)}<small>${esc(r.role)}</small></td>
          <td>${esc(r.status || '—')}</td>
          ${nCell(r.z1)}${nCell(r.z2)}${nCell(r.z3)}${nCell(r.r2z1)}${nCell(r.r2z2)}${nCell(r.r2z3)}${nCell(r.bezExp)}${nCell(r.otLogista)}
          ${kCell(r.late805)}${kCell(r.late830)}${nCell(r.registryErrors)}${kCell(r.clean)}${kCell(r.notNotified)}
          <td>${esc(r.comment)}</td>
          <td class="total-cell">${fInt(r.pay)}</td>
          <td class="total-cell">${fInt(r.fine)}</td>
          <td class="total-cell">${fInt(r.total)}</td>
          <td><span class="pct-pill neutral">${fPct(r.payShare, 1)}</span></td>
        </tr>`;
      }).join('') + `<tr class="sum"><td class="name-cell">Итого</td><td colspan="15"></td><td>${fInt(sp)}</td><td>${fInt(sf)}</td><td>${fInt(st)}</td><td>100%</td></tr>`;

      $('repLegend').innerHTML = isDay
        ? '<b>Статусы:</b> Я — явка · К — командировка · ОТ — отпуск · Б — больничный · У — уволен · В — выходной · ОП — отпросился · НН — неявка без причины.'
        : 'За неделю и месяц значения суммируются по дням. В отметках показано число случаев, в статусе — число дней.';

      $('repMonthlyPanel').classList.toggle('hidden', d.mode !== 'month');
      $('repMonthlyBody').innerHTML = (d.monthly || []).map((r) => `
        <tr>
          <td class="name-cell">${esc(r.name)}<small>${esc(r.role)}</small></td>
          <td>${r.points ? fInt(r.points) : ''}</td>
          <td>${r.points ? `<span class="pct-pill neutral">${fPct(r.pointsShare, 1)}</span>` : ''}</td>
          <td>${r.tonnageKg ? fInt(r.tonnageKg) : ''}</td>
          <td>${r.tonnageKg ? `<span class="pct-pill green">${fPct(r.tonnageShare, 1)}</span>` : ''}</td>
          <td>${r.registrySum ? fInt(r.registrySum) : ''}</td>
          <td>${r.registrySum ? `<span class="pct-pill amber">${fPct(r.registryShare, 1)}</span>` : ''}</td>
        </tr>
      `).join('') + `<tr class="sum"><td class="name-cell">Итого за месяц</td><td>${fInt(k.totalPoints)}</td><td>100%</td><td>${fInt(k.totalTonnageKg)}</td><td>100%</td><td>${fInt(k.totalRegistrySum)}</td><td>100%</td></tr>`;
    }

    function renderSobranieCostsAndCharts(d) {
      const k = d.kpi, c = d.costs, sh = k.shares, hasSales = k.totalRegistrySum > 0;
      const subCards = [
        { label: 'Расходы без найма', val: fRub(k.costWithoutRental), sub: 'ГСМ + Ремонт + ФОТ' },
        { label: hasSales ? '% от реестров (без найма)' : 'Доля ФОТ в затратах', val: hasSales ? fPct(k.pctSalesNoRental, 2) : fPct(k.fotSharePct, 1), sub: hasSales ? 'норма ≤ 3,0%' : `ФОТ: ${fRub(k.fot)}` },
        { label: hasSales ? '% с наймом авто' : 'Всего с наймом авто', val: hasSales ? fPct(k.pctSalesWithRental, 2) : fRub(k.totalCost), sub: hasSales ? `всего ${fRub(k.totalCost)}` : `Найм: ${fRub(c.rental)}` },
        { label: 'Цена рейса', val: k.pricePerTrip ? fRub(k.pricePerTrip) : '—', sub: `${fInt(k.effectiveTrips)} рейсов` },
        { label: 'Цена заказа', val: k.pricePerOrder ? fRub(k.pricePerOrder) : '—', sub: `${fInt(c.orders)} заказов` },
        { label: 'Заказов на рейс', val: k.ordersPerTrip ? k.ordersPerTrip.toFixed(1).replace('.', ',') : '—', sub: `${fInt(c.orders)} / ${fInt(k.effectiveTrips)}` }
      ];
      $('repSubKpis').innerHTML = subCards.map((sc) => `
        <div class="sub-kpi"><div class="sub-kpi-label">${esc(sc.label)}</div><div class="sub-kpi-val">${esc(sc.val)}</div><div class="sub-kpi-foot">${esc(sc.sub)}</div></div>
      `).join('');

      const stripItems = [
        { name: 'ГСМ', val: c.fuel, pct: sh.fuelPct, cls: 'c-fuel' },
        { name: 'Ремонт авто', val: c.repair, pct: sh.repairPct, cls: 'c-repair' },
        { name: 'Найм авто', val: c.rental, pct: sh.rentalPct, cls: 'c-rental' },
        { name: 'ФОТ (осн. + доп.)', val: k.fot, pct: sh.fotPct, cls: 'c-fot' }
      ];
      $('repShareStrip').innerHTML = stripItems.map((it) => `
        <div class="share-chip">
          <div class="share-chip-head"><span class="dot ${it.cls}"></span><b>${esc(it.name)}</b><span class="pct-pill neutral">${fPct(it.pct, 1)}</span></div>
          <div class="share-chip-val">${fRub(it.val)}</div>
        </div>
      `).join('');

      const hist = d.history || [], isNoRent = costViewMode === 'noRent';
      $('stackedChartTitle').textContent = isNoRent ? 'Структура расходов по периодам (без найма авто)' : 'Структура расходов по периодам (ГСМ · Ремонт · Найм · ФОТ)';
      const maxRowTot = Math.max(...hist.map((h) => isNoRent ? h.costNoRental : h.totalCost), 1);

      $('repStackedChart').innerHTML = hist.map((h, idx) => {
        const rowTot = isNoRent ? h.costNoRental : h.totalCost;
        const wPct = Math.max(2, (rowTot / maxRowTot) * 100);
        const fPctW = rowTot > 0 ? (h.fuel / rowTot) * 100 : 0;
        const rPctW = rowTot > 0 ? (h.repair / rowTot) * 100 : 0;
        const nPctW = (!isNoRent && rowTot > 0) ? (h.rental / rowTot) * 100 : 0;
        const pPctW = rowTot > 0 ? (h.fot / rowTot) * 100 : 0;
        return `<div class="st-row ${idx === hist.length - 1 ? 'current' : ''}">
          <div class="st-label">${esc(h.label)}</div>
          <div class="st-track"><div class="st-bar" style="width:${wPct.toFixed(1)}%">
            <span class="st-seg c-fuel" style="width:${fPctW.toFixed(1)}%"></span>
            <span class="st-seg c-repair" style="width:${rPctW.toFixed(1)}%"></span>
            ${!isNoRent ? `<span class="st-seg c-rental" style="width:${nPctW.toFixed(1)}%"></span>` : ''}
            <span class="st-seg c-fot" style="width:${pPctW.toFixed(1)}%"></span>
          </div></div>
          <div class="st-val">${fRub(rowTot)}</div>
        </div>`;
      }).join('');

      const barVals = hist.map((h) => hasSales ? h.pctMetric : (h.pricePerOrder || h.fotShare));
      const normLineVal = hasSales ? 3.0 : (k.pricePerOrder > 0 ? 350 : 65);
      const maxBar = Math.max(...barVals, normLineVal * 1.15, 1);
      const normBottomPct = Math.min(90, Math.max(10, (normLineVal / maxBar) * 100));

      $('repVerticalChart').innerHTML = `
        <div class="vchart-wrap">
          <div class="vchart-norm" style="bottom:${normBottomPct.toFixed(1)}%"></div>
          ${hist.map((h, i) => {
            const v = barVals[i];
            const hPct = Math.max(6, (v / maxBar) * 100);
            const lbl = hasSales ? fPct(v, 2) : (h.pricePerOrder ? fRub(v) : fPct(v, 1));
            return `<div class="vbar-col ${i === hist.length - 1 ? 'active' : ''}">
              <div class="vbar-num ${v > normLineVal ? 'warn' : ''}">${lbl}</div>
              <div class="vbar-pill" style="height:${hPct.toFixed(1)}%"></div>
              <div class="vbar-lbl">${esc(h.shortLabel)}</div>
            </div>`;
          }).join('')}
        </div>`;
    }

    function renderSobranieEmpShares(d) {
      const rows = [...(d.rows || [])];
      const avgShare = 100 / Math.max(1, rows.length);
      if (empShareMode === 'fot') {
        rows.sort((a, b) => b.total - a.total);
        const maxS = Math.max(...rows.map((r) => r.payShare), avgShare * 1.4, 1);
        $('empShareHead').innerHTML = '<tr><th>Сотрудник</th><th>Должность</th><th class="num">ИТОГО ЗП</th><th style="width:36%">Доля в ФОТ · пунктир среднее</th><th class="num">Доля, %</th></tr>';
        $('empShareBody').innerHTML = rows.map((r) => {
          const w = Math.min(100, (r.payShare / maxS) * 100);
          const mk = Math.min(96, (avgShare / maxS) * 100);
          return `<tr><td class="fw600">${esc(r.name)}</td><td class="muted">${esc(r.role)}</td><td class="num fw600">${fRub(r.total)}</td>
            <td><div class="hbar-track"><div class="hbar-fill green" style="width:${w.toFixed(1)}%"></div><div class="hbar-mark" style="left:${mk.toFixed(1)}%"></div></div></td>
            <td class="num"><span class="pct-pill green">${fPct(r.payShare, 1)}</span></td></tr>`;
        }).join('');
      } else if (empShareMode === 'trips') {
        rows.sort((a, b) => b.empTrips - a.empTrips);
        const maxS = Math.max(...rows.map((r) => r.tripsShare), avgShare * 1.4, 1);
        $('empShareHead').innerHTML = '<tr><th>Сотрудник</th><th>Должность</th><th class="num">Рейсов по зонам</th><th style="width:36%">Доля выработки · пунктир среднее</th><th class="num">Доля, %</th></tr>';
        $('empShareBody').innerHTML = rows.map((r) => {
          const w = Math.min(100, (r.tripsShare / maxS) * 100);
          const mk = Math.min(96, (avgShare / maxS) * 100);
          return `<tr><td class="fw600">${esc(r.name)}</td><td class="muted">${esc(r.role)}</td><td class="num fw600">${fInt(r.empTrips)}</td>
            <td><div class="hbar-track"><div class="hbar-fill green" style="width:${w.toFixed(1)}%"></div><div class="hbar-mark" style="left:${mk.toFixed(1)}%"></div></div></td>
            <td class="num"><span class="pct-pill green">${fPct(r.tripsShare, 1)}</span></td></tr>`;
        }).join('');
      } else if (empShareMode === 'discipline') {
        rows.sort((a, b) => b.fine - a.fine);
        const maxS = Math.max(...rows.map((r) => r.fineShare), 20);
        $('empShareHead').innerHTML = '<tr><th>Сотрудник</th><th>Должность</th><th class="num">Штрафы</th><th style="width:36%">Доля в штрафах</th><th class="num">Доля, %</th></tr>';
        $('empShareBody').innerHTML = rows.map((r) => {
          const w = Math.min(100, (r.fineShare / maxS) * 100);
          const cls = r.fine > 0 ? 'red' : 'green';
          return `<tr><td class="fw600">${esc(r.name)}</td><td class="muted">${esc(r.role)}</td><td class="num fw600">${fRub(r.fine)}</td>
            <td><div class="hbar-track"><div class="hbar-fill ${cls}" style="width:${w.toFixed(1)}%"></div></div></td>
            <td class="num"><span class="pct-pill ${cls}">${fPct(r.fineShare, 1)}</span></td></tr>`;
        }).join('');
      } else {
        rows.sort((a, b) => b.registrySum - a.registrySum);
        const maxS = Math.max(...rows.map((r) => r.registryShare), avgShare * 1.4, 1);
        $('empShareHead').innerHTML = '<tr><th>Сотрудник</th><th>Точек, шт</th><th>Тоннаж, кг</th><th>Реестры, ₽</th><th style="width:30%">Доля реестров</th><th class="num">Доля, %</th></tr>';
        $('empShareBody').innerHTML = rows.map((r) => {
          const w = Math.min(100, (r.registryShare / maxS) * 100);
          const mk = Math.min(96, (avgShare / maxS) * 100);
          return `<tr><td class="fw600">${esc(r.name)}</td><td>${fInt(r.points)}</td><td>${fInt(r.tonnageKg)}</td><td class="fw600">${fRub(r.registrySum)}</td>
            <td><div class="hbar-track"><div class="hbar-fill amber" style="width:${w.toFixed(1)}%"></div><div class="hbar-mark" style="left:${mk.toFixed(1)}%"></div></div></td>
            <td class="num"><span class="pct-pill amber">${fPct(r.registryShare, 1)}</span></td></tr>`;
        }).join('');
      }
    }

    // ========================================================================
    // ВКЛАДКА «ВВОД ДАННЫХ» (ДЕНЬ + МАТРИЦА + ИТОГИ МЕСЯЦА 1С)
    // ========================================================================
    let vvodReady = false, vvodStaff = [];

    async function initVvod() {
      if (!vvodReady) {
        vvodReady = true;
        $('vvodDate').value = todayStr();
      }
      await loadVvodDay();
      await loadMonthly($('periodInput').value || currentPeriod());
    }

    function calcRowSalary(role, status, vals) {
      const rLower = String(role || '').toLowerCase();
      let pay = 0, fine = 0;
      if (status === 'Я') {
        if (rLower.includes('водител')) {
          pay = vals.z1 * DEFAULT_TARIFFS.drvZ1 + vals.z2 * DEFAULT_TARIFFS.drvZ2 + vals.z3 * DEFAULT_TARIFFS.drvZ3 +
                vals.r2z1 * DEFAULT_TARIFFS.drvZ1 + vals.r2z2 * DEFAULT_TARIFFS.drvZ2 + vals.r2z3 * DEFAULT_TARIFFS.drvZ3 +
                vals.bezExp * DEFAULT_TARIFFS.bezExp + vals.otLogista;
        } else if (rLower.includes('экспедитор')) {
          pay = vals.z1 * DEFAULT_TARIFFS.expZ1 + vals.z2 * DEFAULT_TARIFFS.expZ2 + vals.z3 * DEFAULT_TARIFFS.expZ3 +
                vals.r2z1 * DEFAULT_TARIFFS.expZ1 + vals.r2z2 * DEFAULT_TARIFFS.expZ2 + vals.r2z3 * DEFAULT_TARIFFS.expZ3 +
                vals.otLogista;
        } else {
          pay = DEFAULT_TARIFFS.base + vals.otLogista;
        }
        fine = (vals.late805 ? DEFAULT_TARIFFS.fine805 : 0) +
               (vals.late830 ? DEFAULT_TARIFFS.fine830 : 0) +
               vals.registryErrors * DEFAULT_TARIFFS.fineReg +
               (vals.clean ? DEFAULT_TARIFFS.fineClean : 0) +
               (vals.notNotified ? DEFAULT_TARIFFS.fineClean : 0);
      } else if (status === 'К') {
        pay = DEFAULT_TARIFFS.base;
      }
      return { pay, fine, total: pay - fine };
    }

    async function loadVvodDay() {
      const dt = $('vvodDate').value || todayStr();
      $('vvodStatus').textContent = 'Загрузка дня...';
      try {
        const src = await fetchAllSourceData();
        vvodStaff = src.staff;
        const cRow = src.costs.find((x) => String(x.cost_date).slice(0, 10) === dt) || {};
        $('cFuel').value = cRow.fuel || '';
        $('cRepair').value = cRow.repair || '';
        $('cRental').value = cRow.rental || '';
        $('cExtra').value = cRow.payroll_extra || '';
        $('cOrders').value = cRow.orders || '';
        $('cTrips').value = cRow.trips || '';
        $('cDeliv').value = cRow.delivery_discrepancies || '';
        $('cAsm').value = cRow.assembly_errors || '';
        $('cRepeat').value = cRow.repeat_deliveries || '';
        $('cExtraStops').value = cRow.extra_stops || '';

        const dayMap = {};
        src.daily.filter((x) => String(x.entry_date).slice(0, 10) === dt).forEach((x) => { dayMap[x.staff_name] = x; });

        $('vvodBody').innerHTML = src.staff.filter((s) => s.active || dayMap[s.name]).map((s) => {
          const r = dayMap[s.name] || {};
          const st = r.status || 'Я';
          const dis = st !== 'Я' ? ' disabled' : '';
          const opts = STATUS_LIST.map((code) => `<option value="${code}"${code === st ? ' selected' : ''}>${code}</option>`).join('');
          const nInp = (cls, v) => `<td><input type="number" min="0" step="1" class="${cls}" value="${num(v)}"${dis} oninput="recalcVvodRow(this)"></td>`;
          const cInp = (cls, v) => `<td><input type="checkbox" class="${cls}"${v ? ' checked' : ''}${dis} onchange="recalcVvodRow(this)"></td>`;
          const calc = r.total !== undefined ? { pay: num(r.pay), fine: num(r.fine), total: num(r.total) } : calcRowSalary(s.role, st, {
            z1: num(r.z1), z2: num(r.z2), z3: num(r.z3), r2z1: num(r.r2z1), r2z2: num(r.r2z2), r2z3: num(r.r2z3),
            bezExp: num(r.bez_exp), otLogista: num(r.ot_logista), late805: !!r.late_805, late830: !!r.late_830,
            registryErrors: num(r.registry_errors), clean: !!r.clean, notNotified: !!r.not_notified
          });

          return `<tr data-name="${esc(s.name)}" data-role="${esc(s.role)}" data-dept="${esc(s.dept || 'ФУД')}" class="status-${esc(st)}">
            <td class="name-cell">${esc(s.name)}<small>${esc(s.role)} · ${esc(s.dept || 'ФУД')}</small></td>
            <td><select class="v-status" onchange="onVvodStatusChange(this)">${opts}</select></td>
            ${nInp('v-z1', r.z1)}${nInp('v-z2', r.z2)}${nInp('v-z3', r.z3)}
            ${nInp('v-r2z1', r.r2z1)}${nInp('v-r2z2', r.r2z2)}${nInp('v-r2z3', r.r2z3)}
            ${nInp('v-bezexp', r.bez_exp)}${nInp('v-otlog', r.ot_logista)}
            ${cInp('v-l805', r.late_805)}${cInp('v-l830', r.late_830)}
            ${nInp('v-regerr', r.registry_errors)}${cInp('v-clean', r.clean)}${cInp('v-notif', r.not_notified)}
            <td><input type="text" class="v-com" value="${esc(r.comment || '')}"></td>
            <td class="total-cell v-pay" data-raw="${calc.pay}">${fInt(calc.pay)}</td>
            <td class="total-cell v-fine" data-raw="${calc.fine}">${fInt(calc.fine)}</td>
            <td class="total-cell v-tot" data-raw="${calc.total}">${fInt(calc.total)}</td>
          </tr>`;
        }).join('');
        $('vvodStatus').textContent = `Загружено за ${formatRuDate(dt)}`;
      } catch (err) {
        $('vvodStatus').textContent = 'Ошибка: ' + err.message;
      }
    }

    function onVvodStatusChange(sel) {
      const tr = sel.closest('tr');
      const st = sel.value;
      tr.className = `status-${st}`;
      const isYavka = st === 'Я';
      tr.querySelectorAll('input').forEach((inp) => {
        if (inp.classList.contains('v-com')) return;
        inp.disabled = !isYavka;
        if (!isYavka) {
          if (inp.type === 'checkbox') inp.checked = false;
          else inp.value = 0;
        }
      });
      recalcVvodRow(sel);
    }

    function recalcVvodRow(el) {
      const tr = el.closest('tr');
      const st = tr.querySelector('.v-status').value;
      const gN = (cls) => num(tr.querySelector(`.${cls}`).value);
      const gC = (cls) => tr.querySelector(`.${cls}`).checked;
      const calc = calcRowSalary(tr.dataset.role, st, {
        z1: gN('v-z1'), z2: gN('v-z2'), z3: gN('v-z3'),
        r2z1: gN('v-r2z1'), r2z2: gN('v-r2z2'), r2z3: gN('v-r2z3'),
        bezExp: gN('v-bezexp'), otLogista: gN('v-otlog'),
        late805: gC('v-l805'), late830: gC('v-l830'),
        registryErrors: gN('v-regerr'), clean: gC('v-clean'), notNotified: gC('v-notif')
      });
      const pEl = tr.querySelector('.v-pay'), fEl = tr.querySelector('.v-fine'), tEl = tr.querySelector('.v-tot');
      pEl.dataset.raw = calc.pay; pEl.textContent = fInt(calc.pay);
      fEl.dataset.raw = calc.fine; fEl.textContent = fInt(calc.fine);
      tEl.dataset.raw = calc.total; tEl.textContent = fInt(calc.total);
    }

