          <tr data-id="${s.id}" data-old-name="${esc(s.name)}">
            <td><input type="text" class="s-name" value="${esc(s.name)}"></td>
            <td><input type="text" class="s-role" list="roleList" value="${esc(s.role)}"></td>
            <td>
              <select class="s-dept">
                <option value="ФУД"${s.dept === 'ФУД' ? ' selected' : ''}>ФУД</option>
                <option value="ХИМ"${s.dept === 'ХИМ' ? ' selected' : ''}>ХИМ</option>
                <option value="ХОР"${s.dept === 'ХОР' ? ' selected' : ''}>ХОР</option>
              </select>
            </td>
            <td style="text-align:center"><input type="checkbox" class="s-act"${s.active ? ' checked' : ''}></td>
            <td><button class="btn secondary btn-sm" onclick="updateStaffRow(this)">Сохранить</button></td>
          </tr>
        `).join('');
        $('staffStatus').textContent = '';
      } catch (err) {
        $('staffStatus').textContent = 'Ошибка: ' + err.message;
      }
    }

    async function addStaffMember() {
      const name = $('sNewName').value.replace(/\s+/g, ' ').trim();
      const role = $('sNewRole').value.replace(/\s+/g, ' ').trim();
      const dept = $('sNewDept').value || 'ФУД';
      if (!name || !role) { alert('Укажите ФИО и должность'); return; }
      $('staffStatus').textContent = 'Добавление...';
      try {
        const { error } = await sbClient.from('staff').insert({ name, role, dept, active: true });
        if (error) throw error;
        $('sNewName').value = ''; $('sNewRole').value = '';
        await loadStaff();
        $('staffStatus').textContent = 'Сотрудник добавлен ✓';
      } catch (err) {
        $('staffStatus').textContent = 'Ошибка: ' + err.message;
      }
    }

    async function updateStaffRow(btn) {
      const tr = btn.closest('tr');
      const id = Number(tr.dataset.id);
      const oldName = tr.dataset.oldName;
      const name = tr.querySelector('.s-name').value.replace(/\s+/g, ' ').trim();
      const role = tr.querySelector('.s-role').value.replace(/\s+/g, ' ').trim();
      const dept = tr.querySelector('.s-dept').value;
      const active = tr.querySelector('.s-act').checked;
      if (!name || !role) { alert('ФИО и должность обязательны'); return; }
      $('staffStatus').textContent = 'Сохранение...';
      try {
        const { error } = await sbClient.from('staff').update({ name, role, dept, active }).eq('id', id);
        if (error) throw error;
        if (oldName && oldName !== name) {
          await sbClient.from('daily_entries').update({ staff_name: name }).eq('staff_name', oldName);
          await sbClient.from('monthly_1c').update({ staff_name: name }).eq('staff_name', oldName);
          tr.dataset.oldName = name;
        }
        $('staffStatus').textContent = 'Сохранено ✓';
      } catch (err) {
        $('staffStatus').textContent = 'Ошибка: ' + err.message;
      }
    }

    // ========================================================================
    // ВКЛАДКА «АНАЛИТИКА» (МАТЕМАТИЧЕСКИЙ ДВИЖОК, ГРАФИКИ, СРАВНЕНИЯ, ЭКСПОРТ)
    // ========================================================================
    let anReady = false;
    function initAnalytics() {
      if (!anReady) {
        anReady = true;
        syncAnalyticsMonth($('periodInput').value || currentPeriod());
        $('normEffDate').value = todayStr();
      }
      loadAnalytics(true);
    }

    function syncAnalyticsMonth(ym) {
      if (!/^\d{4}-\d{2}$/.test(ym)) return;
      const [y, m] = ym.split('-').map(Number);
      const lastD = new Date(Date.UTC(y, m, 0)).getUTCDate();
      $('anFrom').value = `${ym}-01`;
      $('anTo').value = `${ym}-${pad2(lastD)}`;
      const py = m === 1 ? y - 1 : y;
      const pm = m === 1 ? 12 : m - 1;
      const pLast = new Date(Date.UTC(py, pm, 0)).getUTCDate();
      $('anCompFrom').value = `${py}-${pad2(pm)}-01`;
      $('anCompTo').value = `${py}-${pad2(pLast)}`;
    }

    function toggleAnTheme() {
      const isLight = $('tab-analytics').classList.toggle('theme-light');
      $('anThemeBtn').textContent = isLight ? '☀️ Светлая' : '🌙 Тёмная';
    }
    function setAnDept(d) {
      anState.dept = d;
      $('anDeptSeg').querySelectorAll('button').forEach((b, i) => b.classList.toggle('active', ['ВСЕ', 'ФУД', 'ХИМ', 'ХОР'][i] === d));
      loadAnalytics(true);
    }
    function resetAnFilters() {
      anState.dept = 'ВСЕ';
      $('anEmployee').value = 'ВСЕ';
      $('anAllocMethod').value = 'routes';
      syncAnalyticsMonth($('periodInput').value || currentPeriod());
      setAnDept('ВСЕ');
    }
    function switchAnSection(secId, btn) {
      btn.parentElement.querySelectorAll('button').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('#tab-analytics .an-sec').forEach((el) => {
        el.classList.toggle('hidden', secId !== 'all' && el.id !== secId);
      });
    }
    function setAnGranularity(g, btn) {
      anState.granularity = g;
      btn.parentElement.querySelectorAll('button').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      if (anState.bundle) renderAnEfficiency(anState.bundle);
    }
    function setDeptDonutMetric(k, t, btn) {
      anState.deptDonutMetric = k;
      anState.deptDonutTitle = t;
      btn.parentElement.querySelectorAll('button').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      if (anState.bundle) renderAnDepartments(anState.bundle);
    }
    function setAnRoleTab(rt, btn) {
      anState.roleTab = rt;
      btn.parentElement.querySelectorAll('button').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      if (anState.bundle) renderAnStaff(anState.bundle);
    }
    function setQuickComparison(mode) {
      const now = new Date();
      if (mode === 'week') {
        const shift = (now.getDay() + 6) % 7;
        const curMon = new Date(now.getTime() - shift * 86400000);
        const prevMon = new Date(curMon.getTime() - 7 * 86400000);
        const prevSun = new Date(curMon.getTime() - 86400000);
        $('anFrom').value = `${curMon.getFullYear()}-${pad2(curMon.getMonth()+1)}-${pad2(curMon.getDate())}`;
        $('anTo').value = todayStr();
        $('anCompFrom').value = `${prevMon.getFullYear()}-${pad2(prevMon.getMonth()+1)}-${pad2(prevMon.getDate())}`;
        $('anCompTo').value = `${prevSun.getFullYear()}-${pad2(prevSun.getMonth()+1)}-${pad2(prevSun.getDate())}`;
      } else {
        syncAnalyticsMonth($('periodInput').value || currentPeriod());
      }
      loadAnalytics(true);
    }

    function resolveNormsForDate(normsRows, targetDate, dept) {
      const active = {
        efficiencyPct: 95, planFulfillPct: 95, fotToTurnoverPct: 3.0,
        costPerRoute: 4500, costPerPoint: 350, defectPct: 1.0, refusalPct: 1.5, plannedCost: 450000
      };
      const picked = {};
      for (const r of (normsRows || [])) {
        const eff = String(r.effective_from || '').slice(0, 10);
        if (eff > targetDate) continue;
        const dpt = String(r.dept || 'ВСЕ').toUpperCase();
        const prio = dpt === dept ? 2 : (dpt === 'ВСЕ' ? 1 : 0);
        if (!prio) continue;
        const prev = picked[r.metric_code];
        if (!prev || eff > prev.eff || (eff === prev.eff && prio >= prev.prio)) {
          picked[r.metric_code] = { eff, prio };
          active[r.metric_code] = num(r.metric_value);
        }
      }
      return active;
    }

    function computeAnalyticsSlice(src, fromIso, toIso, deptFilter, empFilter, allocMethod) {
      const norms = resolveNormsForDate(src.norms, toIso, deptFilter);
      const staffMap = {};
      src.staff.forEach((s) => { staffMap[s.name] = s; });

      const depts = {
        'ФУД': { name: 'ФУД', turnover: 0, fot: 0, driverFot: 0, expFot: 0, otherFot: 0, routes: 0, points: 0, invoices: 0, weightKg: 0, refusals: 0, driverRefusals: 0, otherRefusals: 0, defects: 0, repeatDeliv: 0, extraStops: 0, errors: 0, allocCost: 0 },
        'ХИМ': { name: 'ХИМ', turnover: 0, fot: 0, driverFot: 0, expFot: 0, otherFot: 0, routes: 0, points: 0, invoices: 0, weightKg: 0, refusals: 0, driverRefusals: 0, otherRefusals: 0, defects: 0, repeatDeliv: 0, extraStops: 0, errors: 0, allocCost: 0 },
        'ХОР': { name: 'ХОР', turnover: 0, fot: 0, driverFot: 0, expFot: 0, otherFot: 0, routes: 0, points: 0, invoices: 0, weightKg: 0, refusals: 0, driverRefusals: 0, otherRefusals: 0, defects: 0, repeatDeliv: 0, extraStops: 0, errors: 0, allocCost: 0 }
      };

      const empMap = {};
      src.staff.forEach((s) => {
        empMap[s.name] = {
          name: s.name, role: s.role, dept: s.dept || 'ФУД', active: s.active,
          routes: 0, points: 0, invoices: 0, weightKg: 0, turnover: 0,
          refusals: 0, driverRefusals: 0, defects: 0, extraStops: 0, errors: 0,
          pay: 0, fine: 0, totalPay: 0, daysWorked: 0,
          deptRoutes: { 'ФУД': 0, 'ХИМ': 0, 'ХОР': 0 }, dailyHistory: {}
        };
      });

      let driverFot = 0, expFot = 0, whFot = 0, zoneRoutes = 0, dailyRef = 0, dailyDef = 0, dailyStops = 0, totErr = 0, shifts = 0, cleanShifts = 0;
      const dayMap = {};
      const rawRecords = [];

      for (const r of src.daily) {
        const ds = String(r.entry_date || '').slice(0, 10);
        if (ds < fromIso || ds > toIso) continue;
        const name = r.staff_name;
        if (empFilter !== 'ВСЕ' && name !== empFilter) continue;
        const sInfo = staffMap[name] || { name, role: r.role || 'Водитель', dept: r.dept || 'ФУД', active: true };
        const rowDept = r.dept || sInfo.dept || 'ФУД';
        if (deptFilter !== 'ВСЕ' && rowDept !== deptFilter) continue;

        const rowRoutes = num(r.z1) + num(r.z2) + num(r.z3) + num(r.r2z1) + num(r.r2z2) + num(r.r2z3);
        const rowErr = (r.late_805 ? 1 : 0) + (r.late_830 ? 1 : 0) + num(r.registry_errors) + (r.not_notified ? 1 : 0) + num(r.defects_day);
        const tot = num(r.total);
        const roleL = String(sInfo.role || '').toLowerCase();

        const es = empMap[name] || (empMap[name] = {
          name, role: sInfo.role, dept: rowDept, active: true,
          routes: 0, points: 0, invoices: 0, weightKg: 0, turnover: 0,
          refusals: 0, driverRefusals: 0, defects: 0, extraStops: 0, errors: 0,
          pay: 0, fine: 0, totalPay: 0, daysWorked: 0, deptRoutes: { 'ФУД': 0, 'ХИМ': 0, 'ХОР': 0 }, dailyHistory: {}
        });
        es.routes += rowRoutes;
        es.points += num(r.points_day);
        es.invoices += num(r.invoices_day);
        es.weightKg += num(r.weight_kg_day);
        es.turnover += num(r.turnover_day);
        es.driverRefusals += num(r.driver_refusals);
        es.refusals += num(r.driver_refusals);
        es.defects += num(r.defects_day);
        es.extraStops += num(r.extra_stops);
        es.errors += rowErr;
        es.pay += num(r.pay); es.fine += num(r.fine); es.totalPay += tot;
        es.deptRoutes[rowDept] = (es.deptRoutes[rowDept] || 0) + Math.max(1, rowRoutes);
        if (r.status === 'Я' || r.status === 'К' || tot > 0 || rowRoutes > 0) {
          es.daysWorked += 1; shifts += 1; if (rowErr === 0) cleanShifts += 1;
        }
        es.dailyHistory[ds] = (es.dailyHistory[ds] || 0) + rowRoutes;

        const dObj = depts[rowDept] || depts['ФУД'];
        dObj.fot += tot;
        if (roleL.includes('водител')) driverFot += tot;
        else if (roleL.includes('экспедитор')) expFot += tot;
        else whFot += tot;
        dObj.routes += rowRoutes;
        dObj.points += num(r.points_day);
        dObj.invoices += num(r.invoices_day);
        dObj.weightKg += num(r.weight_kg_day);
        dObj.turnover += num(r.turnover_day);
        dObj.driverRefusals += num(r.driver_refusals);
        dObj.defects += num(r.defects_day);
        dObj.extraStops += num(r.extra_stops);
        dObj.errors += rowErr;

        zoneRoutes += rowRoutes;
        dailyRef += num(r.driver_refusals);
        dailyDef += num(r.defects_day);
        dailyStops += num(r.extra_stops);
        totErr += rowErr;

        const db = dayMap[ds] || (dayMap[ds] = { date: ds, fot: 0, fuel: 0, repair: 0, rental: 0, extraFot: 0, routes: 0, orders: 0, refusals: 0, defects: 0, repeatDeliv: 0, errors: 0, shifts: 0, cleanShifts: 0 });
        db.fot += tot; db.routes += rowRoutes; db.refusals += num(r.driver_refusals); db.defects += num(r.defects_day); db.errors += rowErr;
        if (r.status === 'Я' || r.status === 'К' || tot > 0 || rowRoutes > 0) { db.shifts += 1; if (rowErr === 0) db.cleanShifts += 1; }

        if (rawRecords.length < 200) {
          rawRecords.push({ date: ds, name, role: sInfo.role, dept: rowDept, status: r.status, routes: rowRoutes, pay: tot, fine: num(r.fine), comment: r.comment || '' });
        }
      }

      // Интеграция месячных показателей 1С
      const startYm = fromIso.slice(0, 7), endYm = toIso.slice(0, 7);
      for (const mr of src.monthly) {
        const mk = String(mr.period_ym || '').slice(0, 7);
        if (mk < startYm || mk > endYm) continue;
        const name = mr.staff_name;
        if (empFilter !== 'ВСЕ' && name !== empFilter) continue;
        const sInfo = staffMap[name] || { name, dept: 'ФУД' };
        const es = empMap[name];
        const pts = num(mr.points), ton = num(mr.tonnage_kg), reg = num(mr.registry_sum);
        if (es) { es.points += pts; es.weightKg += ton; es.turnover += reg; }
        const dr = es ? es.deptRoutes : null;
        const sumR = dr ? (dr['ФУД'] + dr['ХИМ'] + dr['ХОР']) : 0;
        ['ФУД', 'ХИМ', 'ХОР'].forEach((dk) => {
          const share = sumR > 0 ? (dr[dk] || 0) / sumR : ((sInfo.dept || 'ФУД') === dk ? 1 : 0);
          depts[dk].points += Math.round(pts * share);
          depts[dk].weightKg += Math.round(ton * share);
          depts[dk].turnover += Math.round(reg * share);
        });
      }

      let fuel = 0, repair = 0, rental = 0, extraFot = 0, orders = 0, trips = 0, delivDisc = 0, asmErr = 0, repeatDeliv = 0, otherRef = 0, costStops = 0;
      for (const cr of src.costs) {
        const cs = String(cr.cost_date || '').slice(0, 10);
        if (cs < fromIso || cs > toIso) continue;
        fuel += num(cr.fuel); repair += num(cr.repair); rental += num(cr.rental); extraFot += num(cr.payroll_extra);
        orders += num(cr.orders); trips += num(cr.trips); delivDisc += num(cr.delivery_discrepancies);
        asmErr += num(cr.assembly_errors); repeatDeliv += num(cr.repeat_deliveries); otherRef += num(cr.other_refusals); costStops += num(cr.extra_stops);

        const db = dayMap[cs] || (dayMap[cs] = { date: cs, fot: 0, fuel: 0, repair: 0, rental: 0, extraFot: 0, routes: 0, orders: 0, refusals: 0, defects: 0, repeatDeliv: 0, errors: 0, shifts: 0, cleanShifts: 0 });
        db.fuel += num(cr.fuel); db.repair += num(cr.repair); db.rental += num(cr.rental); db.extraFot += num(cr.payroll_extra);
        db.orders += num(cr.orders); db.refusals += num(cr.delivery_discrepancies) + num(cr.other_refusals); db.defects += num(cr.assembly_errors); db.repeatDeliv += num(cr.repeat_deliveries);
      }

      const sumDR = depts['ФУД'].routes + depts['ХИМ'].routes + depts['ХОР'].routes;
      const sumDP = depts['ФУД'].points + depts['ХИМ'].points + depts['ХОР'].points;
      const sumDF = depts['ФУД'].fot + depts['ХИМ'].fot + depts['ХОР'].fot;

      ['ФУД', 'ХИМ', 'ХОР'].forEach((dk) => {
        const d = depts[dk];
        let w = 1 / 3;
        if (allocMethod === 'points' && sumDP > 0) w = d.points / sumDP;
        else if (allocMethod === 'fot' && sumDF > 0) w = d.fot / sumDF;
        else if (sumDR > 0) w = d.routes / sumDR;
        if (deptFilter !== 'ВСЕ') w = dk === deptFilter ? 1 : 0;

        d.fot += Math.round(extraFot * w);
        d.allocCost = d.fot + Math.round((fuel + repair + rental) * w);
        if (d.invoices === 0 && orders > 0) d.invoices = Math.round(orders * w);
        d.otherRefusals += Math.round((delivDisc + otherRef) * w);
        d.refusals = d.driverRefusals + d.otherRefusals;
        d.defects += Math.round(asmErr * w);
        d.repeatDeliv += Math.round(repeatDeliv * w);
        d.extraStops += Math.round(costStops * w);
      });

      let fShare = 1;
      if (deptFilter !== 'ВСЕ') {
        if (allocMethod === 'points' && sumDP > 0) fShare = depts[deptFilter].points / sumDP;
        else if (allocMethod === 'fot' && sumDF > 0) fShare = depts[deptFilter].fot / sumDF;
        else if (sumDR > 0) fShare = depts[deptFilter].routes / sumDR;
      }

      const effFuel = Math.round(fuel * fShare), effRepair = Math.round(repair * fShare), effRental = Math.round(rental * fShare), effExtra = Math.round(extraFot * fShare);
      const totalPayroll = driverFot + expFot + whFot + effExtra;
      const totalLogisticsCost = totalPayroll + effFuel + effRepair + effRental;
      const completedRoutes = zoneRoutes > 0 ? zoneRoutes : Math.round(trips * fShare);
      const deliveredPoints = depts['ФУД'].points + depts['ХИМ'].points + depts['ХОР'].points;
      const totalInvoices = orders > 0 ? Math.round(orders * fShare) : 0;
      const totalWeightKg = depts['ФУД'].weightKg + depts['ХИМ'].weightKg + depts['ХОР'].weightKg;
      const totalTurnover = depts['ФУД'].turnover + depts['ХИМ'].turnover + depts['ХОР'].turnover;

      const refusalsCount = dailyRef + Math.round((delivDisc + otherRef) * fShare);
      const defectsCount = dailyDef + Math.round(asmErr * fShare);
      const repeatDeliveries = Math.round(repeatDeliv * fShare);
      const extraStops = dailyStops + Math.round(costStops * fShare);
      const delivBase = totalInvoices > 0 ? totalInvoices : (deliveredPoints > 0 ? deliveredPoints : 0);

      const costPerRoute = completedRoutes > 0 ? totalLogisticsCost / completedRoutes : null;
      const costPerPoint = deliveredPoints > 0 ? totalLogisticsCost / deliveredPoints : null;
      const avgDeliveryCost = totalInvoices > 0 ? totalLogisticsCost / totalInvoices : costPerPoint;
      const fotToTurnoverPct = totalTurnover > 0 ? (totalPayroll / totalTurnover) * 100 : null;
      const refusalPct = delivBase > 0 ? (refusalsCount / delivBase) * 100 : null;
      const defectPct = delivBase > 0 ? (defectsCount / delivBase) * 100 : null;
      const repeatDelivPct = delivBase > 0 ? (repeatDeliveries / delivBase) * 100 : null;

      const checks = [];
      if (refusalPct !== null) checks.push(refusalPct <= norms.refusalPct ? 100 : Math.max(0, 100 - (refusalPct - norms.refusalPct) * 15));
      if (defectPct !== null) checks.push(defectPct <= norms.defectPct ? 100 : Math.max(0, 100 - (defectPct - norms.defectPct) * 20));
      if (costPerRoute !== null && norms.costPerRoute > 0) checks.push(costPerRoute <= norms.costPerRoute ? 100 : Math.max(0, (norms.costPerRoute / costPerRoute) * 100));
      if (costPerPoint !== null && norms.costPerPoint > 0) checks.push(costPerPoint <= norms.costPerPoint ? 100 : Math.max(0, (norms.costPerPoint / costPerPoint) * 100));
      if (fotToTurnoverPct !== null && norms.fotToTurnoverPct > 0) checks.push(fotToTurnoverPct <= norms.fotToTurnoverPct ? 100 : Math.max(0, (norms.fotToTurnoverPct / fotToTurnoverPct) * 100));
      const discPct = shifts > 0 ? (cleanShifts / shifts) * 100 : null;
      if (discPct !== null) checks.push(discPct);

      const planFulfillPct = checks.length ? checks.reduce((a, b) => a + b, 0) / checks.length : null;
      const qualPct = delivBase > 0 ? Math.max(0, 100 - ((refusalsCount + defectsCount) / delivBase) * 100) : discPct;
      const efficiencyPct = (qualPct !== null && planFulfillPct !== null) ? (qualPct * 0.6 + planFulfillPct * 0.4) : (qualPct ?? planFulfillPct);

      const deptArr = ['ФУД', 'ХИМ', 'ХОР'].map((dk) => {
        const d = depts[dk];
        const db = d.invoices > 0 ? d.invoices : d.points;
        return {
          ...d,
          efficiencyPct: db > 0 ? Math.max(0, 100 - ((d.refusals + d.defects) / db) * 100) : (d.routes > 0 ? 96 : null),
          costPerRoute: d.routes > 0 ? d.allocCost / d.routes : null,
          costPerPoint: d.points > 0 ? d.allocCost / d.points : null,
          fotToTurnoverPct: d.turnover > 0 ? (d.fot / d.turnover) * 100 : null,
          shares: {
            routesPct: sumDR > 0 ? (d.routes / sumDR) * 100 : 0,
            turnoverPct: totalTurnover > 0 ? (d.turnover / totalTurnover) * 100 : 0,
            pointsPct: deliveredPoints > 0 ? (d.points / deliveredPoints) * 100 : 0,
            weightPct: totalWeightKg > 0 ? (d.weightKg / totalWeightKg) * 100 : 0,
            fotPct: totalPayroll > 0 ? (d.fot / totalPayroll) * 100 : 0,
            costPct: totalLogisticsCost > 0 ? (d.allocCost / totalLogisticsCost) * 100 : 0
          }
        };
      });

      const activeEmps = Object.values(empMap).filter((e) => e.active || e.routes > 0 || e.totalPay > 0 || e.points > 0);
      const avgR = activeEmps.length ? zoneRoutes / activeEmps.length : 0;
      const avgP = activeEmps.length ? deliveredPoints / activeEmps.length : 0;
      const avgW = activeEmps.length ? totalWeightKg / activeEmps.length : 0;
      const avgS = activeEmps.length ? extraStops / activeEmps.length : 0;

      const employees = activeEmps.map((e) => {
        const empInv = e.invoices > 0 ? e.invoices : (zoneRoutes > 0 ? Math.round(totalInvoices * (e.routes / zoneRoutes)) : 0);
        const disc = e.daysWorked > 0 ? Math.max(0, 100 - (e.errors / e.daysWorked) * 25) : 100;
        const prod = avgR > 0 ? Math.min(115, (e.routes / avgR) * 100) : (e.daysWorked > 0 ? 100 : 0);
        const kpiPct = (e.routes > 0 || e.daysWorked > 0) ? Math.round((disc * 0.55 + prod * 0.45) * 10) / 10 : 0;
        const effScore = (e.routes > 0 || e.daysWorked > 0) ? Math.min(100, Math.round((disc * 0.65 + Math.min(100, prod) * 0.35) * 10) / 10) : 0;
        const rn = avgR > 0 ? e.routes / avgR : 0;
        const pn = avgP > 0 ? e.points / avgP : rn;
        const wn = avgW > 0 ? e.weightKg / avgW : rn;
        const sn = (e.extraStops + 1) / (avgS + 1);
        const loadIndex = Math.round((rn * 0.35 + pn * 0.30 + wn * 0.25 + sn * 0.10) * 100);
        return {
          ...e, invoices: empInv, kpiPct, efficiencyPct: effScore, loadIndex,
          loadStatus: loadIndex > 125 ? 'Перегружен' : (loadIndex < 75 ? 'Недогружен' : 'Норма')
        };
      });

      const wdNames = [{ idx: 1, name: 'Пн' }, { idx: 2, name: 'Вт' }, { idx: 3, name: 'Ср' }, { idx: 4, name: 'Чт' }, { idx: 5, name: 'Пт' }, { idx: 6, name: 'Сб' }, { idx: 0, name: 'Вс' }];
      const wdAcc = {};
      wdNames.forEach((w) => { wdAcc[w.idx] = { name: w.name, routes: 0, invoices: 0 }; });

      const dailySeries = Object.keys(dayMap).sort().map((dt) => {
        const b = dayMap[dt];
        const dCost = b.fot + b.extraFot + b.fuel + b.repair + b.rental;
        const db = b.orders > 0 ? b.orders : b.routes;
        const dEff = db > 0 ? Math.max(0, 100 - ((b.refusals + b.defects) / db) * 100) : (b.shifts > 0 ? (b.cleanShifts / b.shifts) * 100 : 100);
        const dayObj = new Date(`${dt}T00:00:00Z`);
        if (wdAcc[dayObj.getUTCDay()]) {
          wdAcc[dayObj.getUTCDay()].routes += b.routes;
          wdAcc[dayObj.getUTCDay()].invoices += b.orders;
        }
        return {
          date: dt, label: `${dt.slice(8,10)}.${dt.slice(5,7)}`,
          routes: b.routes, totalCost: dCost, efficiencyPct: Math.round(dEff * 10) / 10,
          normPct: norms.efficiencyPct, refusals: b.refusals, defects: b.defects
        };
      });

      return {
        norms,
        summary: {
          efficiencyPct, planFulfillPct, fotToTurnoverPct, totalLogisticsCost,
          totalPayroll, driverFot, expFot, warehouseFot: whFot, extraFot: effExtra,
          fuelCost: effFuel, repairCost: effRepair, rentalCost: effRental,
          plannedCost: norms.plannedCost, costDeviation: totalLogisticsCost - norms.plannedCost,
          completedRoutes, deliveredPoints, totalInvoices, totalWeightKg, totalTurnover,
          costPerRoute, costPerPoint, avgDeliveryCost,
          avgWeightPerRoute: completedRoutes > 0 ? totalWeightKg / completedRoutes : null,
          avgPointsPerRoute: completedRoutes > 0 ? deliveredPoints / completedRoutes : null,
          refusalsCount, driverRefusals: dailyRef, otherRefusals: Math.max(0, refusalsCount - dailyRef),
          refusalPct, defectsCount, defectPct, repeatDeliveries, repeatDelivPct,
          extraStops, employeeErrors: totErr
        },
        departments: deptArr,
        employees,
        dailySeries,
        weekdayHeatmap: wdNames.map((w) => wdAcc[w.idx]),
        rawRecords
      };
    }

    async function loadAnalytics() {
      $('anLastUpdated').textContent = 'Расчёт аналитики из Supabase...';
      try {
        const src = await fetchAllSourceData();
        const f1 = $('anFrom').value, t1 = $('anTo').value;
        const f2 = $('anCompFrom').value, t2 = $('anCompTo').value;
        const empSel = $('anEmployee').value || 'ВСЕ';
        const alloc = $('anAllocMethod').value || 'routes';

        const curVal = empSel;
        $('anEmployee').innerHTML = '<option value="ВСЕ">Все сотрудники</option>' + src.staff.map((s) =>
          `<option value="${esc(s.name)}"${s.name === curVal ? ' selected' : ''}>${esc(s.name)} (${esc(s.dept || 'ФУД')})</option>`
        ).join('');

        const current = computeAnalyticsSlice(src, f1, t1, anState.dept, $('anEmployee').value, alloc);
        const previous = computeAnalyticsSlice(src, f2, t2, anState.dept, $('anEmployee').value, alloc);

        const prevEmp = {};
        previous.employees.forEach((pe) => { prevEmp[pe.name] = pe; });
        current.employees.forEach((ce) => {
          ce.prevTotalPay = prevEmp[ce.name] ? prevEmp[ce.name].totalPay : 0;
        });

        anState.bundle = {
          generatedAt: new Date().toLocaleString('ru-RU'),
          filters: { from: f1, to: t1, compareFrom: f2, compareTo: t2, dept: anState.dept, employee: $('anEmployee').value, allocMethod: alloc },
          normsActive: current.norms,
          normsHistory: src.norms || [],
          current,
          previous
        };

        $('anLastUpdated').textContent = `Период: ${f1} — ${t1} | Сравнение: ${f2} — ${t2} | Подразделение: ${anState.dept} | Обновлено: ${anState.bundle.generatedAt}`;
        renderAnKpis(anState.bundle);
        renderAnEfficiency(anState.bundle);
        renderAnDepartments(anState.bundle);
        renderAnStaff(anState.bundle);
        renderAnFinance(anState.bundle);
        renderAnQuality(anState.bundle);
        renderAnComparison(anState.bundle);
        renderAnWorkload(anState.bundle);
        renderAnNorms(anState.bundle);
      } catch (err) {
        $('anLastUpdated').textContent = 'Ошибка аналитики: ' + err.message;
      }
    }

    function deltaBadge(cur, prev, lowerBetter, isPp) {
      if (cur === null || prev === null || cur === undefined || prev === undefined) return '<span class="an-badge gray">н/д</span>';
      if (!isPp && Number(prev) === 0) return '<span class="an-badge gray">база 0</span>';
      const diff = isPp ? (Number(cur) - Number(prev)) : (((Number(cur) - Number(prev)) / Number(prev)) * 100);
      if (Math.abs(diff) < 0.05) return '<span class="an-badge gray">0,0%</span>';
      const up = diff > 0;
      const good = lowerBetter ? !up : up;
      return `<span class="an-badge ${good ? 'green' : 'red'}">${up ? '▲ +' : '▼ '}${diff.toFixed(1).replace('.', ',')}${isPp ? ' п.п.' : '%'}</span>`;
    }

    function renderAnKpis(b) {
      const s = b.current.summary, p = b.previous.summary, n = b.normsActive;
      const cards = [
        { title: '1. Общая эффективность логистики', val: fPct(s.efficiencyPct, 1), plan: `Норма ≥ ${fPct(n.efficiencyPct, 1)}`, dev: s.efficiencyPct !== null ? `${(s.efficiencyPct - n.efficiencyPct >= 0 ? '+' : '')}${(s.efficiencyPct - n.efficiencyPct).toFixed(1)} п.п.` : 'н/д', delta: deltaBadge(s.efficiencyPct, p.efficiencyPct, false, true), st: s.efficiencyPct >= n.efficiencyPct ? 'green' : 'red', formula: '0.6 × Качество доставки (%) + 0.4 × Выполнение нормативов (%)' },
        { title: '2. Выполнение нормативов', val: fPct(s.planFulfillPct, 1), plan: `Цель ≥ ${fPct(n.planFulfillPct, 1)}`, dev: s.planFulfillPct !== null ? `${(s.planFulfillPct - n.planFulfillPct >= 0 ? '+' : '')}${(s.planFulfillPct - n.planFulfillPct).toFixed(1)} п.п.` : 'н/д', delta: deltaBadge(s.planFulfillPct, p.planFulfillPct, false, true), st: s.planFulfillPct >= n.planFulfillPct ? 'green' : 'amber', formula: 'Средний процент выполнения нормативов по стоимости, ФОТ/обороту, браку, отказам и дисциплине' },
        { title: '3. ФОТ к обороту', val: fPct(s.fotToTurnoverPct, 2), plan: `Норма ≤ ${fPct(n.fotToTurnoverPct, 2)}`, dev: s.fotToTurnoverPct !== null ? `${(s.fotToTurnoverPct - n.fotToTurnoverPct > 0 ? '+' : '')}${(s.fotToTurnoverPct - n.fotToTurnoverPct).toFixed(2)} п.п.` : 'Нет оборота 1С', delta: deltaBadge(s.fotToTurnoverPct, p.fotToTurnoverPct, true, true), st: s.fotToTurnoverPct !== null && s.fotToTurnoverPct <= n.fotToTurnoverPct ? 'green' : (s.fotToTurnoverPct === null ? 'gray' : 'red'), formula: `ФОТ (${fRub(s.totalPayroll)}) / Оборот из 1С (${fRub(s.totalTurnover)}) × 100%` },
        { title: '4. Общие затраты на логистику', val: fRub(s.totalLogisticsCost), plan: `Бюджет: ${fRub(n.plannedCost)}`, dev: `Откл: ${s.costDeviation > 0 ? '+' : ''}${fRub(s.costDeviation)}`, delta: deltaBadge(s.totalLogisticsCost, p.totalLogisticsCost, true, false), st: s.totalLogisticsCost <= n.plannedCost ? 'green' : 'red', formula: `ФОТ (${fRub(s.totalPayroll)}) + ГСМ (${fRub(s.fuelCost)}) + Ремонт (${fRub(s.repairCost)}) + Найм (${fRub(s.rentalCost)})` },
        { title: '5. Выполненные маршруты', val: fInt(s.completedRoutes), plan: `Ср. вес: ${s.avgWeightPerRoute ? fInt(s.avgWeightPerRoute) + ' кг' : 'н/д'}`, dev: `Накладных: ${fInt(s.totalInvoices)}`, delta: deltaBadge(s.completedRoutes, p.completedRoutes, false, false), st: 'blue', formula: 'Сумма выполненных рейсов по всем зонам (1-й и 2-й рейс) за период' },
        { title: '6. Доставленные точки', val: s.deliveredPoints > 0 ? fInt(s.deliveredPoints) : 'Недостаточно данных', plan: `На марш.: ${s.avgPointsPerRoute ? s.avgPointsPerRoute.toFixed(1) : 'н/д'}`, dev: `Вес: ${s.totalWeightKg > 0 ? fInt(s.totalWeightKg) + ' кг' : 'н/д'}`, delta: deltaBadge(s.deliveredPoints, p.deliveredPoints, false, false), st: s.deliveredPoints > 0 ? 'blue' : 'gray', formula: 'Фактическое количество доставленных торговых точек по данным 1С и путевых листов' },
        { title: '7. Стоимость одного маршрута', val: fRub(s.costPerRoute), plan: `Норма ≤ ${fRub(n.costPerRoute)}`, dev: s.costPerRoute !== null ? `Откл: ${fRub(s.costPerRoute - n.costPerRoute)}` : 'н/д', delta: deltaBadge(s.costPerRoute, p.costPerRoute, true, false), st: s.costPerRoute !== null && s.costPerRoute <= n.costPerRoute ? 'green' : (s.costPerRoute === null ? 'gray' : 'red'), formula: `Общие затраты (${fRub(s.totalLogisticsCost)}) / Выполненные маршруты (${fInt(s.completedRoutes)})` },
        { title: '8. Стоимость одной точки доставки', val: fRub(s.costPerPoint), plan: `Норма ≤ ${fRub(n.costPerPoint)}`, dev: s.costPerPoint !== null ? `Откл: ${fRub(s.costPerPoint - n.costPerPoint)}` : 'н/д', delta: deltaBadge(s.costPerPoint, p.costPerPoint, true, false), st: s.costPerPoint !== null && s.costPerPoint <= n.costPerPoint ? 'green' : (s.costPerPoint === null ? 'gray' : 'red'), formula: `Общие затраты (${fRub(s.totalLogisticsCost)}) / Доставленные точки (${fInt(s.deliveredPoints)})` },
        { title: '9. Количество отказов', val: `${fInt(s.refusalsCount)}${s.refusalPct !== null ? ' (' + fPct(s.refusalPct, 2) + ')' : ''}`, plan: `Норма ≤ ${fPct(n.refusalPct, 1)}`, dev: `Вод.: ${fInt(s.driverRefusals)} · Проч.: ${fInt(s.otherRefusals)}`, delta: deltaBadge(s.refusalsCount, p.refusalsCount, true, false), st: s.refusalsCount === 0 ? 'green' : 'red', formula: 'Отказы по вине водителей + расхождения/прочие отказы' },
        { title: '10. Доля брака (%)', val: fPct(s.defectPct, 2), plan: `Норма ≤ ${fPct(n.defectPct, 2)}`, dev: `Брак/сборка: ${fInt(s.defectsCount)} шт`, delta: deltaBadge(s.defectPct, p.defectPct, true, true), st: s.defectPct !== null && s.defectPct <= n.defectPct ? 'green' : (s.defectPct === null ? 'gray' : 'red'), formula: 'Количество брака и ошибок сборки / Общее количество доставок × 100%' }
      ];
      window._anKpiCards = cards;
      $('anKpiGrid').innerHTML = cards.map((c, idx) => `
        <div class="an-kpi-card st-${c.st}" onclick="openAnKpiModal(${idx})">
          <div class="an-kpi-head"><span class="an-kpi-title">${esc(c.title)}</span>${c.delta}</div>
          <div class="an-kpi-value">${esc(c.val)}</div>
          <div class="an-kpi-meta"><span>${esc(c.plan)}</span><span>${esc(c.dev)}</span></div>
        </div>
      `).join('');
    }

    function renderAnEfficiency(b) {
      const series = b.current.dailySeries || [];
      const normVal = b.normsActive.efficiencyPct || 95;
      if (!series.length) {
        $('anEfficiencyChartBox').innerHTML = '<div class="an-panel-sub">Нет данных за выбранный период</div>';
        $('anPlanFactChartBox').innerHTML = '';
        return;
      }
      const w = 620, h = 210, pl = 38, pr = 16, pt = 20, pb = 30;
      const minV = Math.min(70, ...series.map((x) => x.efficiencyPct));
      const xOf = (i) => series.length === 1 ? w / 2 : pl + (i / (series.length - 1)) * (w - pl - pr);
      const yOf = (v) => h - pb - ((v - minV) / ((100 - minV) || 1)) * (h - pt - pb);
      const ny = yOf(Math.max(minV, Math.min(100, normVal)));
      const poly = series.map((g, i) => `${xOf(i).toFixed(1)},${yOf(g.efficiencyPct).toFixed(1)}`).join(' ');
      const dots = series.map((g, i) => `<circle cx="${xOf(i).toFixed(1)}" cy="${yOf(g.efficiencyPct).toFixed(1)}" r="4" fill="${g.efficiencyPct >= normVal ? '#10b981' : '#ef4444'}"><title>${g.label}: ${g.efficiencyPct}%</title></circle>`).join('');

      $('anEfficiencyChartBox').innerHTML = `
        <div class="chart-title">Динамика эффективности (${anState.granularity}) · пунктир — норма ${normVal}%</div>
        <svg viewBox="0 0 ${w} ${h}" style="width:100%; height:210px; background:var(--an-surface-2); border-radius:10px">
          <line x1="${pl}" y1="${ny.toFixed(1)}" x2="${w - pr}" y2="${ny.toFixed(1)}" stroke="#f59e0b" stroke-width="1.4" stroke-dasharray="4,4"/>
          ${series.length > 1 ? `<polyline fill="none" stroke="#3b82f6" stroke-width="2.4" points="${poly}"/>` : ''}
          ${dots}
        </svg>`;

      const s = b.current.summary, n = b.normsActive;
      const pf = [
        { name: 'Эффективность (%)', fact: s.efficiencyPct, plan: n.efficiencyPct, lower: false, rub: false },
        { name: 'Стоимость 1 маршрута (₽)', fact: s.costPerRoute, plan: n.costPerRoute, lower: true, rub: true },
        { name: 'Стоимость 1 точки (₽)', fact: s.costPerPoint, plan: n.costPerPoint, lower: true, rub: true },
        { name: 'ФОТ к обороту (%)', fact: s.fotToTurnoverPct, plan: n.fotToTurnoverPct, lower: true, rub: false }
      ];
      $('anPlanFactChartBox').innerHTML = '<div class="chart-title">План / Факт по нормативам</div>' + pf.map((item) => {
        if (item.fact === null) return `<div style="margin-bottom:10px; font-size:12.5px">${esc(item.name)}: <span class="an-badge gray">Недостаточно данных</span></div>`;
        const ok = item.lower ? item.fact <= item.plan : item.fact >= item.plan;
        const pctW = Math.min(100, (item.fact / ((item.plan * 1.35) || 1)) * 100);
        return `<div style="margin-bottom:11px">
          <div style="display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:4px">
            <span>${esc(item.name)}</span>
            <span><b>Факт: ${item.rub ? fRub(item.fact) : fPct(item.fact, 2)}</b> / План: ${item.rub ? fRub(item.plan) : fPct(item.plan, 2)}</span>
          </div>
          <div class="an-bar-track"><div class="an-bar-fill" style="width:${pctW.toFixed(1)}%; background:${ok ? 'var(--an-green)' : 'var(--an-red)'}"></div></div>
        </div>`;
      }).join('');
    }

    function renderAnDepartments(b) {
      const depts = b.current.departments || [];
      const mk = anState.deptDonutMetric;
      const colors = { 'ФУД': '#3b82f6', 'ХИМ': '#10b981', 'ХОР': '#f59e0b' };
      const r = 64, circ = 2 * Math.PI * r;
      let off = 0;
      const arcs = depts.map((d) => {
        const pct = d.shares[mk] || 0;
        const len = (pct / 100) * circ;
        const el = `<circle cx="90" cy="90" r="${r}" fill="transparent" stroke="${colors[d.name]}" stroke-width="22" stroke-dasharray="${len.toFixed(2)} ${circ.toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"/>`;
        off += len;
        return el;
      }).join('');

      $('anDeptDonutBox').innerHTML = `
        <div style="display:flex; align-items:center; gap:20px; background:var(--an-surface-2); padding:14px; border-radius:12px; flex-wrap:wrap">
          <svg width="180" height="180" viewBox="0 0 180 180">
            <circle cx="90" cy="90" r="${r}" fill="transparent" stroke="var(--an-border)" stroke-width="22"/>
            ${arcs}
            <text x="90" y="88" text-anchor="middle" fill="var(--an-text)" font-size="11.5" font-weight="700">${esc(anState.deptDonutTitle)}</text>
            <text x="90" y="104" text-anchor="middle" fill="var(--an-muted)" font-size="10.5">100%</text>
          </svg>
          <div>${depts.map((d) => `<div style="margin-bottom:8px; font-size:13px"><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${colors[d.name]};margin-right:7px"></span><b>${d.name}</b>: <span class="an-badge blue">${fPct(d.shares[mk], 1)}</span></div>`).join('')}</div>
        </div>`;

      const maxC = Math.max(...depts.map((d) => d.allocCost), 1);
      $('anDeptBarBox').innerHTML = '<div style="background:var(--an-surface-2); padding:14px; border-radius:12px">' + depts.map((d) => `
        <div style="margin-bottom:12px; cursor:pointer" onclick="setAnDept('${d.name}')">
          <div style="display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:4px">
            <span><b>${d.name}</b> · Марш.: ${fInt(d.routes)} (${fPct(d.shares.routesPct, 1)})</span>
            <span>Затраты: <b>${fRub(d.allocCost)}</b></span>
          </div>
          <div class="an-bar-track"><div class="an-bar-fill" style="width:${Math.max(4, (d.allocCost / maxC) * 100).toFixed(1)}%; background:${colors[d.name]}"></div></div>
        </div>
      `).join('') + '</div>';

      $('anDeptTable').innerHTML = `<thead><tr><th>Отдел</th><th class="num">Оборот (Доля)</th><th class="num">ФОТ (Доля)</th><th class="num">Маршруты (Доля)</th><th class="num">Точки</th><th class="num">Вес, кг</th><th class="num">Отказы / Брак</th><th class="num">Ст-ть марш.</th><th class="num">Ст-ть точки</th></tr></thead><tbody>` +
        depts.map((d) => `<tr>
          <td><b>${d.name}</b></td>
          <td class="num">${d.turnover > 0 ? `${fRub(d.turnover)} <span class="an-badge blue">${fPct(d.shares.turnoverPct, 1)}</span>` : 'Недостаточно данных'}</td>
          <td class="num">${fRub(d.fot)} <span class="an-badge gray">${fPct(d.shares.fotPct, 1)}</span></td>
          <td class="num">${fInt(d.routes)} <span class="an-badge blue">${fPct(d.shares.routesPct, 1)}</span></td>
          <td class="num">${d.points > 0 ? fInt(d.points) : 'Недостаточно данных'}</td>
          <td class="num">${d.weightKg > 0 ? fInt(d.weightKg) : 'Недостаточно данных'}</td>
          <td class="num">${fInt(d.refusals)} / ${fInt(d.defects)}</td>
          <td class="num">${fRub(d.costPerRoute)}</td>
          <td class="num">${fRub(d.costPerPoint)}</td>
        </tr>`).join('') + '</tbody>';
    }

    function renderAnStaff(b) {
      let list = [...(b.current.employees || [])];
      if (anState.roleTab === 'driver') list = list.filter((e) => e.role.toLowerCase().includes('водител'));
      else if (anState.roleTab === 'forwarder') list = list.filter((e) => e.role.toLowerCase().includes('экспедитор'));
      list.sort((a, b) => (b.kpiPct - a.kpiPct) || (b.routes - a.routes));

      $('anStaffTable').innerHTML = `<thead><tr><th>#</th><th>ФИО</th><th>Отдел</th><th class="num">Маршруты</th><th class="num">Точки</th><th class="num">Вес, кг</th><th class="num">Оборот, ₽</th><th class="num">Отказы</th><th class="num">Ошибки</th><th class="num">KPI %</th><th class="num">Начислено</th><th class="num">К пр. пер.</th></tr></thead><tbody>` +
        list.map((e, i) => `<tr style="cursor:pointer" onclick="openAnEmpModal('${esc(e.name)}')">
          <td><b>${i + 1}</b></td>
          <td><b>${esc(e.name)}</b><div style="font-size:11px;color:var(--an-muted)">${esc(e.role)}</div></td>
          <td><span class="an-badge blue">${esc(e.dept)}</span></td>
          <td class="num"><b>${fInt(e.routes)}</b></td>
          <td class="num">${e.points > 0 ? fInt(e.points) : '—'}</td>
          <td class="num">${e.weightKg > 0 ? fInt(e.weightKg) : '—'}</td>
          <td class="num">${e.turnover > 0 ? fRub(e.turnover) : '—'}</td>
          <td class="num">${fInt(e.refusals)}</td>
          <td class="num">${fInt(e.errors)}</td>
          <td class="num"><span class="an-badge ${e.kpiPct >= 95 ? 'green' : 'amber'}">${fPct(e.kpiPct, 1)}</span></td>
          <td class="num"><b>${fRub(e.totalPay)}</b></td>
          <td class="num">${deltaBadge(e.totalPay, e.prevTotalPay, false, false)}</td>
        </tr>`).join('') + '</tbody>';
    }

    function renderAnFinance(b) {
      const s = b.current.summary;
      const fc = [
        { t: 'Общий ФОТ логистики', v: fRub(s.totalPayroll), d: `Вод.: ${fRub(s.driverFot)} · Эксп.: ${fRub(s.expFot)} · Склад/доп.: ${fRub(s.warehouseFot + s.extraFot)}` },
        { t: 'Затраты автопарка', v: fRub(s.fuelCost + s.repairCost + s.rentalCost), d: `ГСМ: ${fRub(s.fuelCost)} · Рем.: ${fRub(s.repairCost)} · Найм: ${fRub(s.rentalCost)}` },
        { t: 'Отклонение от бюджета', v: `${s.costDeviation > 0 ? '+' : ''}${fRub(s.costDeviation)}`, d: `Факт: ${fRub(s.totalLogisticsCost)} − План: ${fRub(s.plannedCost)}` },
        { t: 'Стоимость 1 маршрута', v: fRub(s.costPerRoute), d: `${fRub(s.totalLogisticsCost)} / ${fInt(s.completedRoutes)} марш.` },
        { t: 'Стоимость 1 точки', v: fRub(s.costPerPoint), d: `${fRub(s.totalLogisticsCost)} / ${fInt(s.deliveredPoints)} точек` },
        { t: 'Средняя стоимость доставки', v: fRub(s.avgDeliveryCost), d: `ФОТ к обороту: ${fPct(s.fotToTurnoverPct, 2)}` }
      ];
      $('anFinanceCards').innerHTML = fc.map((x) => `<div style="background:var(--an-surface-2);border:1px solid var(--an-border);border-radius:12px;padding:14px"><div style="font-size:12px;color:var(--an-muted)">${esc(x.t)}</div><div style="font-size:21px;font-weight:700;margin:4px 0">${esc(x.v)}</div><div style="font-size:11.5px;color:var(--an-muted)">${esc(x.d)}</div></div>`).join('');

      const ser = (b.current.dailySeries || []).slice(-10);
      const maxC = Math.max(...ser.map((x) => x.totalCost), 1);
      $('anFinanceDynamicsBox').innerHTML = '<div style="background:var(--an-surface-2);padding:14px;border-radius:12px"><div class="chart-title">Динамика затрат по дням</div>' + ser.map((d) => `
        <div style="display:grid;grid-template-columns:56px 1fr 96px;align-items:center;gap:8px;margin-bottom:7px;font-size:12px">
          <span style="color:var(--an-muted)">${esc(d.label)}</span>
          <div class="an-bar-track"><div class="an-bar-fill" style="width:${Math.max(3, (d.totalCost / maxC) * 100).toFixed(1)}%;background:var(--an-blue)"></div></div>
          <span style="text-align:right;font-weight:600">${fRub(d.totalCost)}</span>
        </div>`).join('') + '</div>';

      $('anFinanceDeptCompareBox').innerHTML = '<div style="background:var(--an-surface-2);padding:14px;border-radius:12px"><div class="chart-title">Затраты по подразделениям</div>' + (b.current.departments || []).map((d) => `
        <div style="padding:8px 0;border-bottom:1px solid var(--an-border);display:flex;justify-content:space-between;font-size:12.5px">
          <span><b>${d.name}</b> (ФОТ: ${fRub(d.fot)})</span>
          <span><b>${fRub(d.allocCost)}</b> (${fPct(d.shares.costPct, 1)})</span>
        </div>`).join('') + '</div>';
    }

    function renderAnQuality(b) {
      const s = b.current.summary;
      const items = [
        { l: 'Отказы по вине водителей', v: s.driverRefusals, c: '#ef4444' },
        { l: 'Расхождения / прочие отказы', v: s.otherRefusals, c: '#f59e0b' },
        { l: 'Брак / ошибки сборки', v: s.defectsCount, c: '#8b5cf6' },
        { l: 'Повторные доставки', v: s.repeatDeliveries, c: '#3b82f6' },
        { l: 'Ошибки и опоздания персонала', v: s.employeeErrors, c: '#ec4899' }
      ];
      const mx = Math.max(...items.map((x) => x.v), 1);
      $('anQualityReasonsBox').innerHTML = '<div style="background:var(--an-surface-2);padding:14px;border-radius:12px"><div class="chart-title">Причины отказов, брака и ошибок</div>' + items.map((x) => `
        <div style="margin-bottom:9px"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px"><span>${esc(x.l)}</span><b>${fInt(x.v)}</b></div>
        <div class="an-bar-track"><div class="an-bar-fill" style="width:${((x.v / mx) * 100).toFixed(1)}%;background:${x.c}"></div></div></div>`).join('') + '</div>';

      $('anQualityDynamicsBox').innerHTML = `<div style="background:var(--an-surface-2);padding:14px;border-radius:12px"><div class="chart-title">Доли отклонений от доставок</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <div style="padding:12px;border:1px solid var(--an-border);border-radius:10px"><div style="font-size:11.5px;color:var(--an-muted)">Доля отказов</div><div style="font-size:20px;font-weight:700">${fPct(s.refusalPct, 2)}</div></div>
          <div style="padding:12px;border:1px solid var(--an-border);border-radius:10px"><div style="font-size:11.5px;color:var(--an-muted)">Доля брака</div><div style="font-size:20px;font-weight:700">${fPct(s.defectPct, 2)}</div></div>
          <div style="padding:12px;border:1px solid var(--an-border);border-radius:10px"><div style="font-size:11.5px;color:var(--an-muted)">Повторные доставки</div><div style="font-size:20px;font-weight:700">${fPct(s.repeatDelivPct, 2)}</div></div>
          <div style="padding:12px;border:1px solid var(--an-border);border-radius:10px"><div style="font-size:11.5px;color:var(--an-muted)">Доп. заезды</div><div style="font-size:20px;font-weight:700">${fInt(s.extraStops)}</div></div>
        </div></div>`;

      $('anQualityEmpTable').innerHTML = `<thead><tr><th>Сотрудник</th><th>Отдел</th><th class="num">Отказы вод.</th><th class="num">Брак</th><th class="num">Ошибки</th><th class="num">Штрафы</th></tr></thead><tbody>` +
        (b.current.employees || []).slice(0, 10).map((e) => `<tr><td><b>${esc(e.name)}</b></td><td>${esc(e.dept)}</td><td class="num">${fInt(e.driverRefusals)}</td><td class="num">${fInt(e.defects)}</td><td class="num">${fInt(e.errors)}</td><td class="num"><b>${fRub(e.fine)}</b></td></tr>`).join('') + '</tbody>';
    }

    function renderAnComparison(b) {
      const c1 = b.previous.summary, c2 = b.current.summary;
      $('anCompSubtitle').textContent = `Период 1 (${b.filters.compareFrom}..${b.filters.compareTo}) против Периода 2 (${b.filters.from}..${b.filters.to})`;
      const rows = [
        ['Оборот, ₽', c1.totalTurnover, c2.totalTurnover, fRub, false, false],
        ['ФОТ логистики, ₽', c1.totalPayroll, c2.totalPayroll, fRub, true, false],
        ['ФОТ к обороту, %', c1.fotToTurnoverPct, c2.fotToTurnoverPct, (v) => fPct(v, 2), true, true],
        ['Выполненные маршруты', c1.completedRoutes, c2.completedRoutes, fInt, false, false],
        ['Доставленные точки', c1.deliveredPoints, c2.deliveredPoints, fInt, false, false],
        ['Накладные, шт', c1.totalInvoices, c2.totalInvoices, fInt, false, false],
        ['Общий вес, кг', c1.totalWeightKg, c2.totalWeightKg, fInt, false, false],
        ['Стоимость 1 маршрута, ₽', c1.costPerRoute, c2.costPerRoute, fRub, true, false],
        ['Стоимость 1 точки, ₽', c1.costPerPoint, c2.costPerPoint, fRub, true, false],
        ['Отказы, шт', c1.refusalsCount, c2.refusalsCount, fInt, true, false],
        ['Брак, шт', c1.defectsCount, c2.defectsCount, fInt, true, false],
        ['Эффективность, %', c1.efficiencyPct, c2.efficiencyPct, (v) => fPct(v, 1), false, true],
        ['Выполнение KPI, %', c1.planFulfillPct, c2.planFulfillPct, (v) => fPct(v, 1), false, true]
      ];
      $('anComparisonTable').innerHTML = `<thead><tr><th>Показатель</th><th class="num">Период 1</th><th class="num">Период 2</th><th class="num">Разница</th><th class="num">Изменение</th></tr></thead><tbody>` +
        rows.map(([label, v1, v2, fmt, lower, isPp]) => {
          const has = v1 !== null && v2 !== null && v1 !== undefined && v2 !== undefined;
          const diff = has ? (v2 - v1) : null;
          const diffStr = diff === null ? '—' : ((diff > 0 ? '+' : '') + (isPp ? diff.toFixed(2).replace('.', ',') + ' п.п.' : Math.round(diff).toLocaleString('ru-RU')));
          return `<tr><td><b>${esc(label)}</b></td><td class="num">${esc(fmt(v1))}</td><td class="num"><b>${esc(fmt(v2))}</b></td><td class="num">${esc(diffStr)}</td><td class="num">${deltaBadge(v2, v1, lower, isPp)}</td></tr>`;
        }).join('') + '</tbody>';
    }

    function renderAnWorkload(b) {
      const wd = b.current.weekdayHeatmap || [];
      const mx = Math.max(...wd.map((x) => x.routes), 1);
      $('anHeatmapBox').innerHTML = '<div style="background:var(--an-surface-2);padding:14px;border-radius:12px"><div class="chart-title">Тепловая карта по дням недели (маршруты)</div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:7px">' +
        wd.map((d) => {
          const alpha = Math.min(0.85, Math.max(0.14, d.routes / mx));
          return `<div class="heat-cell" style="background:rgba(59,130,246,${alpha.toFixed(2)});border:1px solid var(--an-border)"><div>${d.name}</div><div style="font-size:17px;font-weight:700">${fInt(d.routes)}</div><div style="font-size:10px;color:var(--an-muted)">${fInt(d.invoices)} накл.</div></div>`;
        }).join('') + '</div></div>';

      $('anWorkloadBalanceBox').innerHTML = '<div style="background:var(--an-surface-2);padding:14px;border-radius:12px;max-height:220px;overflow-y:auto"><div class="chart-title">Индекс нагрузки сотрудников</div>' +
        (b.current.employees || []).map((e) => {
          const cls = e.loadStatus === 'Перегружен' ? 'red' : (e.loadStatus === 'Недогружен' ? 'amber' : 'green');
          return `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--an-border);font-size:12px"><span><b>${esc(e.name)}</b> (${fInt(e.routes)} марш. · ${fInt(e.weightKg)} кг)</span><span class="an-badge ${cls}">${e.loadIndex}% · ${e.loadStatus}</span></div>`;
        }).join('') + '</div>';
    }

    function renderAnNorms(b) {
      const n = b.normsActive;
      $('normEffPct').value = n.efficiencyPct; $('normPlanPct').value = n.planFulfillPct;
      $('normFotPct').value = n.fotToTurnoverPct; $('normRouteCost').value = n.costPerRoute;
      $('normPointCost').value = n.costPerPoint; $('normDefectPct').value = n.defectPct;
      $('normRefusalPct').value = n.refusalPct; $('normPlannedCost').value = n.plannedCost;

      $('anNormsHistoryTable').innerHTML = `<thead><tr><th>С даты</th><th>Отдел</th><th>Показатель</th><th class="num">Значение</th><th>Автор</th></tr></thead><tbody>` +
        (b.normsHistory || []).slice(0, 30).map((h) => `<tr><td><b>${esc(String(h.effective_from).slice(0,10))}</b></td><td>${esc(h.dept)}</td><td>${esc(h.metric_code)}</td><td class="num"><b>${esc(h.metric_value)}</b></td><td>${esc(h.author || '')}</td></tr>`).join('') + '</tbody>';
    }

    async function saveAnNorms() {
      const effDate = $('normEffDate').value || todayStr();
      const dept = $('normDept').value || 'ВСЕ';
      const pairs = [
        ['efficiencyPct', num($('normEffPct').value)],
        ['planFulfillPct', num($('normPlanPct').value)],
        ['fotToTurnoverPct', num($('normFotPct').value)],
        ['costPerRoute', num($('normRouteCost').value)],
        ['costPerPoint', num($('normPointCost').value)],
        ['defectPct', num($('normDefectPct').value)],
        ['refusalPct', num($('normRefusalPct').value)],
        ['plannedCost', num($('normPlannedCost').value)]
      ].map(([metric_code, metric_value]) => ({ effective_from: effDate, dept, metric_code, metric_value, author: 'Руководитель' }));

      $('normSaveMsg').textContent = 'Сохранение...';
      try {
        const { error } = await sbClient.from('kpi_norms').insert(pairs);
        if (error) throw error;
        $('normSaveMsg').textContent = 'Нормативы добавлены в историю ✓';
        await loadAnalytics(true);
      } catch (err) {
        $('normSaveMsg').textContent = 'Ошибка: ' + err.message;
      }
    }

    function openAnKpiModal(idx) {
      const c = (window._anKpiCards || [])[idx];
      if (!c || !anState.bundle) return;
      const recs = (anState.bundle.current.rawRecords || []).slice(0, 25);
      $('anModalContent').innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3 style="margin:0">${esc(c.title)}</h3><button class="an-btn ghost" onclick="closeAnModal()">✕</button></div>
        <div style="background:var(--an-surface-2);padding:12px;border-radius:10px;margin-bottom:14px;font-size:13px"><b>Значение:</b> ${esc(c.val)} · <b>${esc(c.plan)}</b> · <b>${esc(c.dev)}</b><div style="margin-top:6px;color:var(--an-muted)"><b>Формула:</b> ${esc(c.formula)}</div></div>
        <div class="an-table-wrap" style="max-height:280px"><table class="an-table"><thead><tr><th>Дата</th><th>Сотрудник</th><th>Отдел</th><th>Статус</th><th class="num">Маршруты</th><th class="num">Итого ЗП</th></tr></thead><tbody>` +
        recs.map((r) => `<tr><td>${esc(r.date)}</td><td><b>${esc(r.name)}</b></td><td>${esc(r.dept)}</td><td>${esc(r.status)}</td><td class="num">${fInt(r.routes)}</td><td class="num">${fRub(r.pay)}</td></tr>`).join('') + '</tbody></table></div>';
      $('anModalBackdrop').classList.remove('hidden');
    }

    function openAnEmpModal(name) {
      const emp = (anState.bundle?.current?.employees || []).find((e) => e.name === name);
      if (!emp) return;
      const days = Object.keys(emp.dailyHistory || {}).sort().map((d) => `<span class="an-badge blue" style="margin:2px">${d.slice(8,10)}.${d.slice(5,7)}: ${emp.dailyHistory[d]}</span>`).join(' ');
      $('anModalContent').innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div><h3 style="margin:0">${esc(emp.name)}</h3><div style="font-size:12px;color:var(--an-muted)">${esc(emp.role)} · ${esc(emp.dept)}</div></div><button class="an-btn ghost" onclick="closeAnModal()">✕</button></div>
        <div class="an-grid-3" style="margin-bottom:12px">
          <div style="background:var(--an-surface-2);padding:12px;border-radius:10px"><div style="font-size:11.5px;color:var(--an-muted)">Начислено</div><div style="font-size:20px;font-weight:700">${fRub(emp.totalPay)}</div></div>
          <div style="background:var(--an-surface-2);padding:12px;border-radius:10px"><div style="font-size:11.5px;color:var(--an-muted)">Маршруты / Точки</div><div style="font-size:20px;font-weight:700">${fInt(emp.routes)} / ${fInt(emp.points)}</div></div>
          <div style="background:var(--an-surface-2);padding:12px;border-radius:10px"><div style="font-size:11.5px;color:var(--an-muted)">KPI / Нагрузка</div><div style="font-size:20px;font-weight:700">${fPct(emp.kpiPct, 1)} / ${emp.loadIndex}%</div></div>
        </div>
        <div style="background:var(--an-surface-2);padding:12px;border-radius:10px"><div class="chart-title">Выходы по дням (маршруты)</div>${days || 'Нет данных'}</div>`;
      $('anModalBackdrop').classList.remove('hidden');
    }

    function closeAnModal() { $('anModalBackdrop').classList.add('hidden'); }

    function exportAnalyticsExcel() {
      if (!anState.bundle) return;
      const type = $('anExportType').value;
      const b = anState.bundle;
      let tableHtml = '';
      if (type === 'depts') tableHtml = $('anDeptTable').outerHTML;
      else if (type === 'drivers' || type === 'forwarders') tableHtml = $('anStaffTable').outerHTML;
      else if (type === 'quality') tableHtml = $('anQualityEmpTable').outerHTML;
      else if (type === 'comparison') tableHtml = $('anComparisonTable').outerHTML;
      else {
        const s = b.current.summary;
        tableHtml = `<table border="1"><tr><th>Показатель</th><th>Значение</th></tr>
          <tr><td>Эффективность логистики</td><td>${fPct(s.efficiencyPct, 1)}</td></tr>
          <tr><td>Выполнение нормативов</td><td>${fPct(s.planFulfillPct, 1)}</td></tr>
          <tr><td>ФОТ к обороту</td><td>${fPct(s.fotToTurnoverPct, 2)}</td></tr>
          <tr><td>Общие затраты</td><td>${fRub(s.totalLogisticsCost)}</td></tr>
          <tr><td>Маршруты</td><td>${fInt(s.completedRoutes)}</td></tr>
          <tr><td>Доставленные точки</td><td>${fInt(s.deliveredPoints)}</td></tr>
          <tr><td>Стоимость маршрута</td><td>${fRub(s.costPerRoute)}</td></tr>
          <tr><td>Стоимость точки</td><td>${fRub(s.costPerPoint)}</td></tr>
          <tr><td>Отказы</td><td>${fInt(s.refusalsCount)}</td></tr>
          <tr><td>Доля брака</td><td>${fPct(s.defectPct, 2)}</td></tr></table>`;
      }
      const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8"></head><body><h3>${esc(type)} (${esc(b.filters.from)} — ${esc(b.filters.to)})</h3>${tableHtml}</body></html>`;
      const blob = new Blob(['\ufeff' + html], { type: 'application/vnd.ms-excel;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `logistics_${type}_${b.filters.from}.xls`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function exportAnalyticsPdf() { window.print(); }

    // ========================================================================
    // ИНИЦИАЛИЗАЦИЯ ПРИ ЗАГРУЗКЕ СТРАНИЦЫ
    // ========================================================================
    $('periodInput').value = currentPeriod();
    $('periodInput').addEventListener('change', () => {
      const ym = $('periodInput').value;
      if (activeTab === 'sobranie') { $('repMonth').value = ym; loadSobranie(true); }
      if (activeTab === 'analytics') { syncAnalyticsMonth(ym); loadAnalytics(true); }
      if (activeTab === 'vvod') loadMonthly(ym);
    });

    initSupabaseClient();
    if (sbClient) {
      loadSobranie(true);
    } else {
      $('repStatus').textContent = 'Подключите Supabase во вкладке «⚙️ Настройки Supabase»';
    }
  </script>
</body>
</html>
