<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Склад и логистика — Supabase Web App & Analytics</title>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --blue: #0e6b7a;
      --blue-dark: #0a4f5b;
      --bg: #eef1f4;
      --card: #ffffff;
      --border: #dde3e8;
      --text: #17212b;
      --muted: #68768a;
      --green: #169c65;
      --red: #d94848;
      --orange: #e89b2d;
      --yellow: #f2b705;
      --soft: #f6f8fa;
      --amber: #fff3cf;
      --r: 12px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.45 "Golos Text", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-variant-numeric: tabular-nums;
    }
    .hidden { display: none !important; }

    /* Верхняя панель навигации */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px 20px;
      background: var(--card);
      padding: 0 24px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .topbar .title { padding: 12px 0; }
    .topbar .title h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .topbar .title h1::before {
      content: "";
      width: 11px;
      height: 11px;
      background: var(--yellow);
      border-radius: 3px;
    }
    .topbar .title p { margin: 2px 0 0 21px; color: var(--muted); font-size: 12.5px; }

    .tabs { display: flex; gap: 2px; align-self: stretch; overflow-x: auto; }
    .tabs button {
      border: 0;
      background: none;
      padding: 0 15px;
      min-height: 54px;
      cursor: pointer;
      font: 600 13.5px "Golos Text", sans-serif;
      color: var(--muted);
      border-bottom: 3px solid transparent;
      margin-bottom: -1px;
      white-space: nowrap;
    }
    .tabs button:hover { color: var(--text); }
    .tabs button.active { color: var(--text); border-bottom-color: var(--yellow); }

    .period-picker { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 0; }
    .period-picker label { color: var(--muted); font-size: 12.5px; }

    input[type=number], input[type=text], input[type=date], input[type=month], input[type=password], select {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 10px;
      font: inherit;
      background: #fff;
      color: var(--text);
    }
    input:focus, select:focus { outline: 2px solid rgba(14, 107, 122, 0.28); border-color: var(--blue); }
    input:disabled { background: var(--soft); color: #a3adb8; }

    .content { padding: 22px 24px 64px; max-width: 1540px; margin: 0 auto; }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 18px 20px;
      margin-bottom: 18px;
    }
    .panel h3 { margin: 0 0 12px; font-size: 15.5px; font-weight: 700; }
    .sub-hint { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 10px; }
    .toolbar h3 { margin: 0; display: flex; align-items: center; gap: 10px; }

    .mode-badge { font-size: 11.5px; font-weight: 600; padding: 3px 10px; border-radius: 99px; }
    .mode-badge.view { background: #e8eef2; color: var(--muted); }
    .mode-badge.edit { background: var(--amber); color: #7a5a00; }

    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; }
    .seg button {
      border: 0;
      background: #fff;
      padding: 7px 14px;
      font: 600 12.5px "Golos Text", sans-serif;
      color: var(--muted);
      cursor: pointer;
    }
    .seg button + button { border-left: 1px solid var(--border); }
    .seg button.on { background: var(--blue); color: #fff; }

    .pill-tabs { display: inline-flex; gap: 6px; flex-wrap: wrap; }
    .pill-btn {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 99px;
      padding: 5px 13px;
      font: 600 12px "Golos Text", sans-serif;
      cursor: pointer;
    }
    .pill-btn.on { background: #17212b; color: #fff; border-color: #17212b; }

    /* Карточки Собрания и графики */
    .kpi-grid-6 { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 12px; margin-bottom: 18px; }
    .kpi-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .kpi-box.alert { background: #fdecec; border-color: #f8d0d0; }
    .kpi-box.alert .kpi-box-label, .kpi-box.alert .kpi-box-val, .kpi-box.alert .kpi-box-sub { color: #9e1c1c; }
    .kpi-box-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .kpi-box-label { font-size: 12.5px; font-weight: 500; color: var(--muted); }
    .status-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
    .status-dot.green { background: var(--green); }
    .status-dot.red { background: var(--red); }
    .status-dot.gray { background: #94a3b8; }
    .kpi-box-val { font-size: 25px; font-weight: 700; line-height: 1.15; margin-bottom: 4px; }
    .kpi-box-sub { font-size: 11.5px; color: var(--muted); margin-bottom: 6px; min-height: 16px; }
    .kpi-box-spark { height: 34px; width: 100%; }
    .spark-svg { width: 100%; height: 34px; display: block; overflow: visible; }

    .delta { font-weight: 600; font-size: 11.5px; }
    .delta.good { color: var(--green); }
    .delta.bad { color: var(--red); }
    .delta.muted { color: var(--muted); font-weight: 400; }

    .sub-kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(185px, 1fr)); gap: 10px; margin-bottom: 12px; }
    .sub-kpi { background: #f3f5f7; border-radius: 10px; padding: 12px 14px; }
    .sub-kpi-label { font-size: 11.5px; color: var(--muted); margin-bottom: 3px; }
    .sub-kpi-val { font-size: 20px; font-weight: 700; margin-bottom: 3px; }
    .sub-kpi-foot { font-size: 11px; color: var(--muted); }

    .share-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin-bottom: 16px; }
    .share-chip { border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; background: #fafbfc; }
    .share-chip-head { display: flex; align-items: center; gap: 7px; font-size: 12px; margin-bottom: 3px; }
    .share-chip-head b { flex: 1; }
    .share-chip-val { font-size: 15px; font-weight: 700; }

    .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
    .c-fuel { background: #2563eb; }
    .c-repair { background: #d97706; }
    .c-rental { background: #ea580c; }
    .c-fot { background: #8c96a5; }

    .charts-2col { display: grid; grid-template-columns: 1.15fr 1fr; gap: 20px; align-items: start; }
    .chart-box { background: #fff; border-top: 1px solid var(--border); padding-top: 12px; }
    .chart-title { font-size: 12px; color: var(--muted); margin-bottom: 10px; font-weight: 500; }
    .chart-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 10px; }
    .chart-legend span { display: inline-flex; align-items: center; gap: 6px; }

    .st-row { display: grid; grid-template-columns: 88px 1fr 94px; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 12px; }
    .st-row.current .st-label, .st-row.current .st-val { font-weight: 700; color: var(--text); }
    .st-label { color: var(--muted); white-space: nowrap; }
    .st-track { background: #f1f4f8; border-radius: 5px; height: 15px; overflow: hidden; }
    .st-bar { display: flex; height: 100%; border-radius: 5px; overflow: hidden; min-width: 4px; }
    .st-seg { height: 100%; display: block; }
    .st-val { text-align: right; white-space: nowrap; }

    .vchart-wrap { position: relative; height: 168px; display: grid; grid-template-columns: repeat(auto-fit, minmax(42px, 1fr)); gap: 8px; align-items: end; padding: 24px 4px 22px; }
    .vchart-norm { position: absolute; left: 0; right: 0; border-top: 1.5px dashed #e06c6c; pointer-events: none; z-index: 2; }
    .vbar-col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; position: relative; }
    .vbar-num { font-size: 11px; font-weight: 600; color: var(--green); margin-bottom: 4px; white-space: nowrap; }
    .vbar-num.warn { color: #b45309; }
    .vbar-pill { width: 100%; background: #95d5b9; border-radius: 6px 6px 2px 2px; min-height: 6px; }
    .vbar-col.active .vbar-pill { background: #12995f; }
    .vbar-lbl { position: absolute; bottom: -20px; font-size: 11px; color: var(--muted); white-space: nowrap; }

    table.share-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    table.share-table th, table.share-table td { padding: 8px 10px; border-bottom: 1px solid #eef1f4; text-align: left; }
    table.share-table th { color: var(--muted); font-weight: 600; font-size: 11.5px; background: #fafbfc; }
    table.share-table th.num, table.share-table td.num { text-align: right; }
    .fw600 { font-weight: 600; }
    .muted { color: var(--muted); }
    .hbar-track { position: relative; height: 9px; background: #edf0f4; border-radius: 99px; overflow: visible; }
    .hbar-fill { height: 100%; border-radius: 99px; }
    .hbar-fill.green { background: #169c65; }
    .hbar-fill.amber { background: #d99014; }
    .hbar-fill.red { background: #d94848; }
    .hbar-fill.neutral { background: #94a3b8; }
    .hbar-mark { position: absolute; top: -4px; bottom: -4px; width: 1.5px; border-left: 1.5px dashed #64748b; pointer-events: none; }

    .pct-pill { display: inline-block; padding: 2px 7px; border-radius: 6px; font-weight: 600; font-size: 11.5px; }
    .pct-pill.green { background: #e3f7ed; color: #0f7a4d; }
    .pct-pill.amber { background: #fef3d6; color: #946200; }
    .pct-pill.red { background: #fde8e8; color: #b42318; }
    .pct-pill.neutral { background: #eef1f5; color: #475569; }

    .field-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 12px; }
    .field-grid.add-row { grid-template-columns: 2fr 1fr 1fr auto; align-items: end; }
    .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .field input, .field select { width: 100%; }

    .table-wrap { overflow: auto; max-height: 68vh; border: 1px solid var(--border); border-radius: var(--r); }
    table.matrix { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12.5px; }
    table.matrix th, table.matrix td { padding: 7px 8px; text-align: center; white-space: nowrap; border-bottom: 1px solid var(--border); border-right: 1px solid #eef1f4; }
    table.matrix thead th { background: var(--soft); color: var(--muted); font-weight: 600; position: sticky; top: 0; z-index: 2; }
    table.matrix tbody tr { background: var(--card); }
    table.matrix td.name-cell { text-align: left; font-weight: 600; min-width: 175px; white-space: normal; position: sticky; left: 0; background: inherit; z-index: 1; }
    .name-cell small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; }
    table.matrix input[type=number] { width: 58px; padding: 4px; text-align: center; border-radius: 6px; }
    table.matrix input[type=text] { width: 120px; padding: 4px 6px; border-radius: 6px; }
    table.matrix select { padding: 4px; border-radius: 6px; font-weight: 600; }
    table.matrix input[type=checkbox] { width: 15px; height: 15px; accent-color: var(--blue); }
    .total-cell { font-weight: 700; }
    table.matrix td.total-cell:nth-last-child(2) { background: var(--amber); }
    table.matrix tr.sum td { font-weight: 700; background: var(--soft); position: sticky; bottom: 0; }

    .status-ОТ, .status-Б, .status-У, .status-В { background: #f1f3f6 !important; color: var(--muted); }
    .status-НН { background: #fdeaea !important; }
    .status-К { background: #eaf1ff !important; }
    .status-ОП { background: #fff8e6 !important; }

    .btn { background: var(--blue); color: #fff; border: 0; border-radius: 8px; padding: 8px 15px; font: 600 13.5px "Golos Text", sans-serif; cursor: pointer; }
    .btn:hover { background: var(--blue-dark); }
    .btn.secondary { background: #fff; color: var(--blue-dark); border: 1px solid var(--blue); }
    .btn.secondary:hover { background: #f0f7f8; }
    .btn.btn-sm { padding: 6px 12px; font-size: 12px; }
    .status-msg { font-size: 12.5px; color: var(--green); font-weight: 500; }
    .legend { font-size: 12px; color: var(--muted); margin-top: 10px; line-height: 1.65; }

    table.settings-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.settings-table th, table.settings-table td { border-bottom: 1px solid var(--border); padding: 8px; text-align: left; }
    table.settings-table th { background: var(--soft); color: var(--muted); font-weight: 600; }

    /* ======================================================================
       МОДУЛЬ ANALYTICS DASHBOARD (DARK / LIGHT SAAS BI)
       ====================================================================== */
    #tab-analytics {
      --an-bg: #0b0f17;
      --an-surface: #111827;
      --an-surface-2: #1a2333;
      --an-surface-hover: #1e293b;
      --an-border: #243044;
      --an-text: #f1f5f9;
      --an-muted: #94a3b8;
      --an-green: #10b981;
      --an-green-bg: rgba(16, 185, 129, 0.14);
      --an-red: #ef4444;
      --an-red-bg: rgba(239, 68, 68, 0.14);
      --an-amber: #f59e0b;
      --an-amber-bg: rgba(245, 158, 11, 0.14);
      --an-blue: #3b82f6;
      --an-blue-bg: rgba(59, 130, 246, 0.14);
      --an-shadow: 0 10px 28px -6px rgba(0, 0, 0, 0.55);

      background: var(--an-bg);
      color: var(--an-text);
      margin: -22px -24px -64px;
      padding: 22px 24px 72px;
      min-height: calc(100vh - 55px);
    }
    #tab-analytics.theme-light {
      --an-bg: #f1f5f9;
      --an-surface: #ffffff;
      --an-surface-2: #f8fafc;
      --an-surface-hover: #f1f5f9;
      --an-border: #e2e8f0;
      --an-text: #0f172a;
      --an-muted: #64748b;
      --an-shadow: 0 6px 20px -4px rgba(15, 23, 42, 0.07);
    }
    .an-container { max-width: 1520px; margin: 0 auto; }
    .an-filter-bar {
      background: var(--an-surface);
      border: 1px solid var(--an-border);
      border-radius: 14px;
      padding: 16px 20px;
      margin-bottom: 16px;
      box-shadow: var(--an-shadow);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .an-filter-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .an-brand { display: flex; align-items: center; gap: 12px; }
    .an-brand-badge {
      background: linear-gradient(135deg, #3b82f6, #10b981);
      color: #fff;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 99px;
    }
    .an-brand h2 { margin: 0; font-size: 17.5px; font-weight: 700; color: var(--an-text); }
    .an-filter-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .an-field { display: flex; flex-direction: column; gap: 4px; }
    .an-field label { font-size: 10.5px; font-weight: 600; color: var(--an-muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .an-input, .an-select {
      background: var(--an-surface-2) !important;
      border: 1px solid var(--an-border) !important;
      color: var(--an-text) !important;
      border-radius: 8px;
      padding: 7px 10px;
      font: 500 12.5px "Golos Text", sans-serif;
    }
    .an-seg {
      display: inline-flex;
      background: var(--an-surface-2);
      border: 1px solid var(--an-border);
      border-radius: 9px;
      padding: 3px;
      gap: 3px;
    }
    .an-seg button {
      border: 0;
      background: transparent;
      color: var(--an-muted);
      font: 600 12px "Golos Text", sans-serif;
      padding: 5px 11px;
      border-radius: 6px;
      cursor: pointer;
    }
    .an-seg button.active { background: var(--an-blue); color: #fff; }
    .an-btn {
      background: var(--an-blue);
      color: #fff;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 7px 13px;
      font: 600 12.5px "Golos Text", sans-serif;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .an-btn.ghost { background: var(--an-surface-2); color: var(--an-text); border-color: var(--an-border); }
    .an-btn.emerald { background: var(--an-green); }

    .an-subnav { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px; }
    .an-subnav button {
      background: var(--an-surface);
      border: 1px solid var(--an-border);
      color: var(--an-muted);
      border-radius: 10px;
      padding: 8px 14px;
      font: 600 12.5px "Golos Text", sans-serif;
      cursor: pointer;
      white-space: nowrap;
    }
    .an-subnav button.active { background: var(--an-blue-bg); color: var(--an-blue); border-color: var(--an-blue); }

    .an-kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(265px, 1fr)); gap: 13px; margin-bottom: 18px; }
    .an-kpi-card {
      background: var(--an-surface);
      border: 1px solid var(--an-border);
      border-radius: 13px;
      padding: 15px 17px;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .an-kpi-card:hover { transform: translateY(-2px); border-color: var(--an-blue); }
    .an-kpi-card.st-green { border-left: 4px solid var(--an-green); }
    .an-kpi-card.st-red { border-left: 4px solid var(--an-red); }
    .an-kpi-card.st-amber { border-left: 4px solid var(--an-amber); }
    .an-kpi-card.st-blue { border-left: 4px solid var(--an-blue); }
    .an-kpi-card.st-gray { border-left: 4px solid #64748b; }

    .an-kpi-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
    .an-kpi-title { font-size: 12px; font-weight: 600; color: var(--an-muted); }
    .an-badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
    .an-badge.green { background: var(--an-green-bg); color: var(--an-green); }
    .an-badge.red { background: var(--an-red-bg); color: var(--an-red); }
    .an-badge.amber { background: var(--an-amber-bg); color: var(--an-amber); }
    .an-badge.blue { background: var(--an-blue-bg); color: var(--an-blue); }
    .an-badge.gray { background: rgba(148, 163, 184, 0.15); color: var(--an-muted); }

    .an-kpi-value { font-size: 25px; font-weight: 700; color: var(--an-text); line-height: 1.15; margin-bottom: 8px; }
    .an-kpi-meta {
      display: flex;
      justify-content: space-between;
      font-size: 11.5px;
      color: var(--an-muted);
      border-top: 1px solid var(--an-border);
      padding-top: 7px;
      gap: 8px;
    }

    .an-panel {
      background: var(--an-surface);
      border: 1px solid var(--an-border);
      border-radius: 14px;
      padding: 18px 20px;
      margin-bottom: 16px;
      box-shadow: var(--an-shadow);
    }
    .an-panel-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
    .an-panel-title { margin: 0; font-size: 15.5px; font-weight: 700; color: var(--an-text); }
    .an-panel-sub { font-size: 12px; color: var(--an-muted); margin-top: 2px; }
    .an-grid-2 { display: grid; grid-template-columns: 1.15fr 1fr; gap: 16px; }
    .an-grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }

    .an-table-wrap { overflow-x: auto; border: 1px solid var(--an-border); border-radius: 10px; }
    table.an-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    table.an-table th, table.an-table td { padding: 9px 11px; border-bottom: 1px solid var(--an-border); text-align: left; white-space: nowrap; }
    table.an-table th { background: var(--an-surface-2); color: var(--an-muted); font-weight: 600; font-size: 11px; text-transform: uppercase; }
    table.an-table tbody tr:hover { background: var(--an-surface-hover); }
    table.an-table th.num, table.an-table td.num { text-align: right; }

    .an-bar-track { height: 8px; background: var(--an-surface-2); border-radius: 99px; overflow: hidden; min-width: 80px; }
    .an-bar-fill { height: 100%; border-radius: 99px; }
    .heat-cell { border-radius: 8px; padding: 9px 6px; text-align: center; font-weight: 600; font-size: 12px; }

    .an-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 15, 0.75);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1200;
      padding: 18px;
    }
    .an-modal {
      background: var(--an-surface);
      color: var(--an-text);
      border: 1px solid var(--an-border);
      border-radius: 16px;
      max-width: 920px;
      width: 100%;
      max-height: 88vh;
      overflow-y: auto;
      padding: 22px;
    }

    @media (max-width: 960px) {
      .an-grid-2, .charts-2col { grid-template-columns: 1fr; }
      #tab-analytics { margin: -16px -12px -48px; padding: 16px 12px 56px; }
    }
    @media print {
      .topbar, .an-filter-bar, .an-subnav, .no-print { display: none !important; }
      #tab-analytics { background: #fff !important; color: #000 !important; margin: 0; padding: 0; }
    }
  </style>
</head>
<body>

  <!-- ВЕРХНЯЯ НАВИГАЦИЯ -->
  <div class="topbar">
    <div class="title">
      <h1>Склад и логистика</h1>
      <p id="sbConnectionBadge">Supabase Web App · Руководитель: Курбанов Нариман</p>
    </div>
    <div class="tabs">
      <button id="tab-btn-sobranie" class="active" onclick="switchTab('sobranie')">Собрание</button>
      <button id="tab-btn-analytics" onclick="switchTab('analytics')">📊 Аналитика</button>
      <button id="tab-btn-vvod" onclick="switchTab('vvod')">Ввод данных</button>
      <button id="tab-btn-staff" onclick="switchTab('staff')">Сотрудники</button>
      <button id="tab-btn-settings" onclick="switchTab('settings')">⚙️ Настройки Supabase</button>
    </div>
    <div class="period-picker">
      <label for="periodInput">Период:</label>
      <input type="month" id="periodInput">
    </div>
  </div>

  <div class="content">
    <!-- ====================================================================
         ВКЛАДКА 1: СОБРАНИЕ
         ==================================================================== -->
    <div id="tab-sobranie">
      <div class="panel">
        <div class="toolbar">
          <h3>Отчёт <span class="mode-badge view">🔒 Только просмотр</span></h3>
          <div class="period-picker">
            <div class="seg">
              <button id="seg-day" class="on" onclick="setRepMode('day')">День</button>
              <button id="seg-week" onclick="setRepMode('week')">Неделя</button>
              <button id="seg-month" onclick="setRepMode('month')">Месяц</button>
            </div>
            <input type="date" id="repDate" onchange="loadSobranie(true)">
            <input type="month" id="repMonth" class="hidden" onchange="loadSobranie(true)">
            <button class="btn secondary btn-sm" onclick="loadSobranie(true)">↻ Обновить</button>
            <span id="repStatus" class="status-msg"></span>
          </div>
        </div>
      </div>

      <div class="kpi-grid-6" id="kpiTopGrid"></div>

      <div class="panel">
        <div class="toolbar">
          <h3>1. Расходы на логистику и структура затрат</h3>
          <div class="pill-tabs" id="costModePills">
            <button class="pill-btn on" onclick="setCostViewMode('all')">Все расходы</button>
            <button class="pill-btn" onclick="setCostViewMode('noRent')">Без найма авто</button>
          </div>
        </div>
        <div class="sub-kpi-grid" id="repSubKpis"></div>
        <div class="share-strip" id="repShareStrip"></div>
        <div class="charts-2col">
          <div class="chart-box">
            <div class="chart-title" id="stackedChartTitle">Структура расходов по периодам</div>
            <div id="repStackedChart"></div>
            <div class="chart-legend">
              <span><i class="dot c-fuel"></i>ГСМ</span>
              <span><i class="dot c-repair"></i>Ремонт авто</span>
              <span><i class="dot c-rental"></i>Найм авто</span>
              <span><i class="dot c-fot"></i>ФОТ</span>
            </div>
          </div>
          <div class="chart-box">
            <div class="chart-title" id="barChartTitle">Цена одного заказа по периодам</div>
            <div id="repVerticalChart"></div>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="toolbar">
          <div>
            <h3>2. Доля и показатели по сотрудникам</h3>
            <div class="sub-hint" id="sharePanelHint">Распределение нагрузки, ФОТ и дисциплины с отметкой среднего уровня</div>
          </div>
          <div class="pill-tabs" id="empMetricPills">
            <button class="pill-btn on" onclick="setEmpShareMode('fot')">Доля ФОТ</button>
            <button class="pill-btn" onclick="setEmpShareMode('trips')">Выработка (рейсы)</button>
            <button class="pill-btn" onclick="setEmpShareMode('discipline')">Штрафы и ошибки</button>
            <button class="pill-btn" onclick="setEmpShareMode('1c')">Итоги 1С (тоннаж / реестры)</button>
          </div>
        </div>
        <div class="table-wrap">
          <table class="share-table">
            <thead id="empShareHead"></thead>
            <tbody id="empShareBody"></tbody>
          </table>
        </div>
      </div>

      <div class="panel">
        <h3>3. Статус явки, выработка и ЗП сотрудников (матрица)</h3>
        <div class="table-wrap">
          <table class="matrix">
            <thead>
              <tr>
                <th rowspan="2">Сотрудник</th><th rowspan="2">Статус</th>
                <th colspan="3">1 рейс</th><th colspan="3">2 рейс</th>
                <th rowspan="2">Без&nbsp;эксп</th><th rowspan="2">От&nbsp;логиста,&nbsp;₽</th>
                <th rowspan="2">Опазд&nbsp;8:05</th><th rowspan="2">Опазд&nbsp;8:30</th>
                <th rowspan="2">Реестр&nbsp;(ош.)</th><th rowspan="2">Чистота</th><th rowspan="2">Не&nbsp;увед.</th>
                <th rowspan="2">Комментарий</th><th rowspan="2">Оплата</th><th rowspan="2">Штраф</th>
                <th rowspan="2">ИТОГО&nbsp;ЗП</th><th rowspan="2">Доля&nbsp;ФОТ</th>
              </tr>
              <tr><th>1 зона</th><th>2 зона</th><th>3 зона</th><th>1з</th><th>2з</th><th>3з</th></tr>
            </thead>
            <tbody id="repBody"></tbody>
          </table>
        </div>
        <div class="legend" id="repLegend"></div>
      </div>

      <div class="panel" id="repMonthlyPanel">
        <h3>4. Итоги за месяц (из 1С) — точки / тоннаж / реестры и доли (%)</h3>
        <div class="table-wrap" style="max-height:48vh">
          <table class="matrix">
            <thead>
              <tr>
                <th>Сотрудник</th><th>Торговых точек, шт</th><th>Доля точек</th>
                <th>Тоннаж, кг</th><th>Доля тоннажа</th><th>Сумма реестров, ₽</th><th>Доля реестров</th>
              </tr>
            </thead>
            <tbody id="repMonthlyBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- ====================================================================
         ВКЛАДКА 2: ANALYTICS DASHBOARD
         ==================================================================== -->
    <div id="tab-analytics" class="hidden">
      <div class="an-container">
        <div class="an-filter-bar">
          <div class="an-filter-top">
            <div class="an-brand">
              <span class="an-brand-badge">Supabase BI</span>
              <div>
                <h2>Аналитика эффективности и стоимости логистики</h2>
                <div class="an-panel-sub" id="anLastUpdated">Реальные данные из Supabase · Ожидание загрузки...</div>
              </div>
            </div>
            <div class="an-filter-controls">
              <div class="an-seg" id="anDeptSeg">
                <button class="active" onclick="setAnDept('ВСЕ')">ВСЕ</button>
                <button onclick="setAnDept('ФУД')">ФУД</button>
                <button onclick="setAnDept('ХИМ')">ХИМ</button>
                <button onclick="setAnDept('ХОР')">ХОР</button>
              </div>
              <button class="an-btn ghost" onclick="toggleAnTheme()" id="anThemeBtn">🌙 Тема</button>
              <button class="an-btn ghost" onclick="resetAnFilters()">Сбросить</button>
              <button class="an-btn" onclick="loadAnalytics(true)">↻ Обновить</button>
            </div>
          </div>

          <div class="an-filter-controls" style="justify-content:space-between; border-top:1px solid var(--an-border); padding-top:12px">
            <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end">
              <div class="an-field"><label>Период С</label><input type="date" id="anFrom" class="an-input"></div>
              <div class="an-field"><label>По</label><input type="date" id="anTo" class="an-input"></div>
              <div class="an-field"><label>Сравнить С</label><input type="date" id="anCompFrom" class="an-input"></div>
              <div class="an-field"><label>Сравнить По</label><input type="date" id="anCompTo" class="an-input"></div>
              <div class="an-field">
                <label>Сотрудник</label>
                <select id="anEmployee" class="an-select" onchange="loadAnalytics(true)">
                  <option value="ВСЕ">Все сотрудники</option>
                </select>
              </div>
              <div class="an-field">
                <label>База затрат</label>
                <select id="anAllocMethod" class="an-select" onchange="loadAnalytics(true)">
                  <option value="routes">По маршрутам</option>
                  <option value="points">По точкам</option>
                  <option value="fot">По ФОТ</option>
                </select>
              </div>
              <button class="an-btn ghost" onclick="loadAnalytics(true)">Применить</button>
            </div>

            <div style="display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap">
              <div class="an-field">
                <label>Отчёт для выгрузки</label>
                <select id="anExportType" class="an-select">
                  <option value="summary">1. Общая эффективность логистики</option>
                  <option value="depts">2. Отчёт по подразделениям</option>
                  <option value="drivers">3. Отчёт по водителям</option>
                  <option value="forwarders">4. Отчёт по экспедиторам</option>
                  <option value="finance">5. Финансовый отчёт</option>
                  <option value="quality">6. Отчёт по качеству доставки</option>
                  <option value="comparison">7. Сравнение периодов</option>
                </select>
              </div>
              <button class="an-btn emerald" onclick="exportAnalyticsExcel()">📥 Excel (.xls)</button>
              <button class="an-btn ghost" onclick="exportAnalyticsPdf()">📄 PDF</button>
            </div>
          </div>
        </div>

        <div class="an-subnav">
          <button class="active" onclick="switchAnSection('all', this)">Все блоки</button>
          <button onclick="switchAnSection('sec-eff', this)">Эффективность и План/Факт</button>
          <button onclick="switchAnSection('sec-depts', this)">Подразделения</button>
          <button onclick="switchAnSection('sec-staff', this)">Водители и Экспедиторы</button>
          <button onclick="switchAnSection('sec-fin', this)">Финансы</button>
          <button onclick="switchAnSection('sec-qual', this)">Качество доставки</button>
          <button onclick="switchAnSection('sec-comp', this)">Сравнение периодов</button>
          <button onclick="switchAnSection('sec-load', this)">Загруженность и Heatmap</button>
          <button onclick="switchAnSection('sec-norms', this)">🎯 Нормы и KPI</button>
        </div>

        <div class="an-kpi-grid" id="anKpiGrid"></div>

        <div class="an-panel an-sec" id="sec-eff">
          <div class="an-panel-head">
            <div>
              <h3 class="an-panel-title">Динамика эффективности логистики и План / Факт</h3>
              <div class="an-panel-sub">Оценка изменений эффективности по выбранному шагу и соответствие нормативам</div>
            </div>
            <div class="an-seg">
              <button class="active" onclick="setAnGranularity('day', this)">По дням</button>
              <button onclick="setAnGranularity('week', this)">По неделям</button>
              <button onclick="setAnGranularity('month', this)">По месяцам</button>
            </div>
          </div>
          <div class="an-grid-2">
            <div id="anEfficiencyChartBox"></div>
            <div id="anPlanFactChartBox"></div>
          </div>
        </div>

        <div class="an-panel an-sec" id="sec-depts">
          <div class="an-panel-head">
            <div>
              <h3 class="an-panel-title">Структура подразделений: ФУД · ХИМ · ХОР</h3>
              <div class="an-panel-sub">Каждая доля рассчитывается строго от своей базы (маршруты, оборот, точки, вес, ФОТ)</div>
            </div>
            <div class="an-seg">
              <button class="active" onclick="setDeptDonutMetric('routesPct', 'Доля по маршрутам', this)">По маршрутам</button>
              <button onclick="setDeptDonutMetric('turnoverPct', 'Доля по обороту', this)">По обороту</button>
              <button onclick="setDeptDonutMetric('pointsPct', 'Доля по точкам', this)">По точкам</button>
              <button onclick="setDeptDonutMetric('weightPct', 'Доля по весу', this)">По весу</button>
              <button onclick="setDeptDonutMetric('fotPct', 'Доля по ФОТ', this)">По ФОТ</button>
            </div>
          </div>
          <div class="an-grid-2" style="margin-bottom:14px">
            <div id="anDeptDonutBox"></div>
            <div id="anDeptBarBox"></div>
          </div>
          <div class="an-table-wrap"><table class="an-table" id="anDeptTable"></table></div>
        </div>

        <div class="an-panel an-sec" id="sec-staff">
          <div class="an-panel-head">
            <div>
              <h3 class="an-panel-title">Рейтинг и аналитика сотрудников</h3>
              <div class="an-panel-sub">Нажмите на строку сотрудника для открытия индивидуальной карточки</div>
            </div>
            <div class="an-seg">
              <button class="active" onclick="setAnRoleTab('driver', this)">Водители</button>
              <button onclick="setAnRoleTab('forwarder', this)">Экспедиторы</button>
              <button onclick="setAnRoleTab('all', this)">Все</button>
            </div>
          </div>
          <div class="an-table-wrap"><table class="an-table" id="anStaffTable"></table></div>
        </div>

        <div class="an-panel an-sec" id="sec-fin">
          <div class="an-panel-head">
            <div><h3 class="an-panel-title">Финансы, структура ФОТ и стоимость логистики</h3></div>
          </div>
          <div class="an-grid-3" id="anFinanceCards" style="margin-bottom:14px"></div>
          <div class="an-grid-2">
            <div id="anFinanceDynamicsBox"></div>
            <div id="anFinanceDeptCompareBox"></div>
          </div>
        </div>

        <div class="an-panel an-sec" id="sec-qual">
          <div class="an-panel-head">
            <div><h3 class="an-panel-title">Качество доставки: отказы, брак, повторные доставки и ошибки</h3></div>
          </div>
          <div class="an-grid-2" style="margin-bottom:14px">
            <div id="anQualityReasonsBox"></div>
            <div id="anQualityDynamicsBox"></div>
          </div>
          <div class="an-table-wrap"><table class="an-table" id="anQualityEmpTable"></table></div>
        </div>

        <div class="an-panel an-sec" id="sec-comp">
          <div class="an-panel-head">
            <div>
              <h3 class="an-panel-title">Сравнение двух периодов</h3>
              <div class="an-panel-sub" id="anCompSubtitle"></div>
            </div>
            <div class="an-seg">
              <button onclick="setQuickComparison('week')">Неделя к неделе</button>
              <button onclick="setQuickComparison('month')">Месяц к месяцу</button>
            </div>
          </div>
          <div class="an-table-wrap"><table class="an-table" id="anComparisonTable"></table></div>
        </div>

        <div class="an-panel an-sec" id="sec-load">
          <div class="an-panel-head">
            <div><h3 class="an-panel-title">Загруженность логистики и тепловая карта по дням недели</h3></div>
          </div>
          <div class="an-grid-2">
            <div id="anHeatmapBox"></div>
            <div id="anWorkloadBalanceBox"></div>
          </div>
        </div>

        <div class="an-panel an-sec" id="sec-norms">
          <div class="an-panel-head">
            <div>
              <h3 class="an-panel-title">🎯 Нормативы и целевые KPI</h3>
              <div class="an-panel-sub">Сохраняются в таблицу <code>kpi_norms</code> с датой начала действия и не переписывают историю</div>
            </div>
          </div>
          <div class="an-grid-3" style="margin-bottom:14px">
            <div class="an-field"><label>Действует с даты</label><input type="date" id="normEffDate" class="an-input"></div>
            <div class="an-field">
              <label>Подразделение</label>
              <select id="normDept" class="an-select">
                <option value="ВСЕ">ВСЕ</option>
                <option value="ФУД">ФУД</option>
                <option value="ХИМ">ХИМ</option>
                <option value="ХОР">ХОР</option>
              </select>
            </div>
            <div class="an-field"><label>Эффективность (%)</label><input type="number" step="0.1" id="normEffPct" class="an-input"></div>
            <div class="an-field"><label>Выполнение плана (%)</label><input type="number" step="0.1" id="normPlanPct" class="an-input"></div>
            <div class="an-field"><label>ФОТ к обороту (≤ %)</label><input type="number" step="0.1" id="normFotPct" class="an-input"></div>
            <div class="an-field"><label>Стоимость маршрута (≤ ₽)</label><input type="number" step="10" id="normRouteCost" class="an-input"></div>
            <div class="an-field"><label>Стоимость точки (≤ ₽)</label><input type="number" step="5" id="normPointCost" class="an-input"></div>
            <div class="an-field"><label>Доля брака (≤ %)</label><input type="number" step="0.1" id="normDefectPct" class="an-input"></div>
            <div class="an-field"><label>Доля отказов (≤ %)</label><input type="number" step="0.1" id="normRefusalPct" class="an-input"></div>
            <div class="an-field"><label>Бюджет затрат (₽)</label><input type="number" step="1000" id="normPlannedCost" class="an-input"></div>
          </div>
          <div style="display:flex; align-items:center; gap:12px; margin-bottom:14px">
            <button class="an-btn emerald" onclick="saveAnNorms()">💾 Сохранить нормативы</button>
            <span id="normSaveMsg" style="font-size:12.5px; color:var(--an-green)"></span>
          </div>
          <div class="an-table-wrap" style="max-height:220px"><table class="an-table" id="anNormsHistoryTable"></table></div>
        </div>
      </div>

      <div id="anModalBackdrop" class="an-modal-backdrop hidden" onclick="if(event.target===this)closeAnModal()">
        <div class="an-modal" id="anModalContent"></div>
      </div>
    </div>

    <!-- ====================================================================
         ВКЛАДКА 3: ВВОД ДАННЫХ (ДЕНЬ + МАТРИЦА + ИТОГИ 1С ЗА МЕСЯЦ)
         ==================================================================== -->
    <div id="tab-vvod" class="hidden">
      <div class="panel">
        <div class="toolbar" style="margin-bottom:0">
          <div style="display:flex; align-items:center; gap:10px">
            <h3 style="margin:0">Заполнение метрик за конкретный день</h3>
            <span class="mode-badge edit">✏️ Редактирование</span>
          </div>
          <div class="period-picker">
            <label for="vvodDate">Дата рейсов:</label>
            <input type="date" id="vvodDate" onchange="loadVvodDay()">
            <button class="btn secondary btn-sm" onclick="loadVvodDay()">Загрузить день</button>
            <span id="vvodStatus" class="status-msg"></span>
          </div>
        </div>
      </div>

      <div class="panel">
        <h3>1. Расходы на логистику и показатели доставки за день</h3>
        <div class="field-grid">
          <div class="field"><label>ГСМ, ₽</label><input type="number" id="cFuel" min="0" step="1"></div>
          <div class="field"><label>Ремонт авто, ₽</label><input type="number" id="cRepair" min="0" step="1"></div>
          <div class="field"><label>Найм авто, ₽</label><input type="number" id="cRental" min="0" step="1"></div>
          <div class="field"><label>ФОТ (доп), ₽</label><input type="number" id="cExtra" min="0" step="1"></div>
          <div class="field"><label>Заказов (накладных), шт</label><input type="number" id="cOrders" min="0" step="1"></div>
          <div class="field"><label>Рейсов (маршрутов), шт</label><input type="number" id="cTrips" min="0" step="1"></div>
          <div class="field"><label>Расхождений / отказов, шт</label><input type="number" id="cDeliv" min="0" step="1"></div>
          <div class="field"><label>Ошибок сборки / брак, шт</label><input type="number" id="cAsm" min="0" step="1"></div>
          <div class="field"><label>Повторных доставок, шт</label><input type="number" id="cRepeat" min="0" step="1"></div>
          <div class="field"><label>Доп. заездов, шт</label><input type="number" id="cExtraStops" min="0" step="1"></div>
        </div>
        <div style="display:flex; align-items:center; gap:12px">
          <button class="btn" onclick="saveVvodCosts()">Сохранить расходы дня</button>
          <span id="costsSaveStatus" class="status-msg"></span>
        </div>
      </div>

      <div class="panel">
        <div class="toolbar">
          <h3>2. Статус явки, выработка и ЗП сотрудников за день (матрица)</h3>
          <div style="display:flex; align-items:center; gap:10px">
            <span id="matrixSaveStatus" class="status-msg"></span>
            <button class="btn" onclick="saveVvodMatrix()">Сохранить всю матрицу</button>
          </div>
        </div>
        <div class="table-wrap">
          <table class="matrix">
            <thead>
              <tr>
                <th rowspan="2">Сотрудник</th><th rowspan="2">Статус</th>
                <th colspan="3">1 рейс</th><th colspan="3">2 рейс</th>
                <th rowspan="2">Без&nbsp;эксп</th><th rowspan="2">От&nbsp;логиста,&nbsp;₽</th>
                <th rowspan="2">Опазд&nbsp;8:05</th><th rowspan="2">Опазд&nbsp;8:30</th>
                <th rowspan="2">Реестр&nbsp;(ош.)</th><th rowspan="2">Чистота</th><th rowspan="2">Не&nbsp;увед.</th>
                <th rowspan="2">Комментарий</th><th rowspan="2">Оплата</th><th rowspan="2">Штраф</th><th rowspan="2">ИТОГО&nbsp;ЗП</th>
              </tr>
              <tr><th>1 зона</th><th>2 зона</th><th>3 зона</th><th>1з</th><th>2з</th><th>3з</th></tr>
            </thead>
            <tbody id="vvodBody"></tbody>
          </table>
        </div>
      </div>

      <div class="panel">
        <div class="toolbar">
          <div>
            <h3>3. Итоги за месяц (из 1С) — точки / тоннаж / реестры</h3>
            <div class="sub-hint">Период: <b id="vvodMonthlyPeriodLabel">—</b> (синхронизирован с полем «Период» вверху)</div>
          </div>
          <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap">
            <button class="btn secondary btn-sm" onclick="loadMonthly(document.getElementById('periodInput').value)">↻ Загрузить месяц</button>
            <button class="btn" onclick="saveVvodMonthly()">Сохранить итоги месяца</button>
            <span id="monthlySaveStatus" class="status-msg"></span>
          </div>
        </div>
        <div class="table-wrap" style="max-height:52vh">
          <table class="matrix">
            <thead>
              <tr>
                <th>Сотрудник</th>
                <th>Торговых точек, шт</th>
                <th>Тоннаж, кг</th>
                <th>Сумма реестров (оборот), ₽</th>
              </tr>
            </thead>
            <tbody id="vvodMonthlyBody"></tbody>
            <tfoot>
              <tr class="sum">
                <td class="name-cell">ИТОГО ЗА МЕСЯЦ</td>
                <td id="mSumPoints">0</td>
                <td id="mSumTonnage">0 кг</td>
                <td id="mSumRegistry">0 ₽</td>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>
    </div>

    <!-- ====================================================================
         ВКЛАДКА 4: СОТРУДНИКИ
         ==================================================================== -->
    <div id="tab-staff" class="hidden">
      <div class="panel">
        <h3>Добавить сотрудника</h3>
        <div class="field-grid add-row">
          <div class="field"><label>ФИО</label><input type="text" id="sNewName" placeholder="Фамилия Имя"></div>
          <div class="field">
            <label>Должность</label>
            <input type="text" id="sNewRole" list="roleList" placeholder="Водитель">
          </div>
          <div class="field">
            <label>Подразделение</label>
            <select id="sNewDept">
              <option value="ФУД">ФУД</option>
              <option value="ХИМ">ХИМ</option>
              <option value="ХОР">ХОР</option>
